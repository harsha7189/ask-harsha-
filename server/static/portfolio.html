<!doctype html><html><head><meta charset=utf8><link rel="icon" href="/static/icon-192.png"><meta name="description" content="Harsha Reddy, technical product manager: experience, case studies and credentials, with an AI agent you can ask."><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Harsha Reddy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=DM+Serif+Display&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: a résumé told as a streaming catalog. "Who's watching?" picks an audience lens; the lens chooses the featured title and the order of the shelves. Titles open a detail sheet; Play runs a full-screen trailer of the work's key beats. */
:root{
  --bg:#0b0b0b;        /* near-black ground */
  --panel:#181818;     /* sheets, menus */
  --raise:#252525;     /* chips, placeholders */
  --line:#333333;
  --fg:#f5f5f1;
  --muted:#a6a6a6;
  --red:#e50914;       /* brand red */
  --red-hot:#ff2a36;
  --good:#46d369;      /* match percentage */
  --black:#000000;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-serif:"DM Serif Display",Georgia,serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --gl:max(clamp(16px,4vw,56px),env(safe-area-inset-left,0px));
  --gr:max(clamp(16px,4vw,56px),env(safe-area-inset-right,0px));
  --cw:clamp(150px,19vw,290px);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
svg{display:block}

/* header */
.top{position:fixed;inset:0 0 auto;z-index:40;padding-top:env(safe-area-inset-top,0px);background:linear-gradient(180deg,color-mix(in srgb,var(--black) 85%,transparent),color-mix(in srgb,var(--black) 0%,transparent));transition:background-color .3s}
.top.solid{background-color:var(--bg)}
.top-inner{display:flex;align-items:center;gap:clamp(14px,2.6vw,36px);min-height:68px;padding-left:var(--gl);padding-right:var(--gr)}
.logo{font-family:var(--f-display);font-weight:900;font-size:30px;letter-spacing:.02em;color:var(--red);line-height:1;white-space:nowrap;text-transform:uppercase}
.tabs{display:flex;gap:clamp(12px,1.8vw,24px);min-width:0}
.tab{font-size:14px;color:color-mix(in srgb,var(--fg) 80%,transparent);white-space:nowrap;padding-block:6px;transition:color .15s}
.tab:hover{color:var(--muted)}
.tab[aria-current="page"]{color:var(--fg);font-weight:700}
.top-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.search{display:flex;align-items:center;gap:6px;border:1px solid transparent;padding:4px 6px;transition:border-color .2s,background-color .2s}
.search.open{border-color:var(--fg);background:color-mix(in srgb,var(--black) 80%,transparent)}
.search input{width:0;opacity:0;background:transparent;border:0;color:var(--fg);font:inherit;font-size:14px;transition:width .25s,opacity .2s}
.search input:focus{outline:none}
.search.open input{width:min(220px,40vw);opacity:1}
.search input::-webkit-search-cancel-button{-webkit-appearance:none}
.icon-btn{width:30px;height:30px;display:grid;place-items:center}
.icon-btn svg{width:22px;height:22px}
.contact-btn{background:var(--red);color:var(--fg);font-weight:700;font-size:13px;padding:6px 12px;border-radius:4px;white-space:nowrap}
.contact-btn:hover{background:var(--red-hot)}
.av{display:grid;place-items:center;border-radius:5px;background:var(--c,var(--red));color:var(--fg)}
.av svg{width:58%;height:58%}
.av-btn{display:flex;align-items:center;gap:6px}
.av-btn .av{width:34px;height:34px}
.av-btn>svg{width:16px;height:16px;transition:transform .2s}
.av-btn[aria-expanded="true"]>svg{transform:rotate(180deg)}
.menu{position:fixed;z-index:50;top:calc(64px + env(safe-area-inset-top,0px));right:var(--gr);width:260px;background:color-mix(in srgb,var(--black) 92%,transparent);border:1px solid var(--line);padding:8px;display:grid;gap:2px;box-shadow:0 18px 40px color-mix(in srgb,var(--black) 60%,transparent)}
.mi{display:flex;align-items:center;gap:10px;padding:8px;border-radius:4px;text-align:left;font-size:14px}
.mi:hover{background:var(--raise)}
.mi .av{width:30px;height:30px;flex:0 0 auto}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.menu .note{font-size:12px;color:var(--muted);padding:2px 8px 6px;margin:0}
.menu .note b{color:var(--fg);font-weight:600}
@media (max-width:820px){
  .top-inner{flex-wrap:wrap;min-height:0;padding-block:10px 4px}
  .tabs{order:3;width:100%;overflow-x:auto;scrollbar-width:none;padding-block:4px 2px;gap:18px}
  .tabs::-webkit-scrollbar{display:none}
  .logo{font-size:24px}
  .contact-btn{padding:6px 10px}
}
@media (max-width:420px){.search.open~.contact-btn{display:none}}

/* hero */
.hero{position:relative;min-height:clamp(480px,56vw,790px);display:flex;align-items:flex-end;padding-bottom:clamp(110px,12vw,190px);overflow:hidden}
.hero-art{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,color-mix(in srgb,var(--black) 85%,transparent) 0%,color-mix(in srgb,var(--black) 30%,transparent) 48%,transparent 72%),linear-gradient(0deg,var(--bg) 0%,color-mix(in srgb,var(--bg) 0%,transparent) 38%)}
.hero-body{position:relative;z-index:2;max-width:min(640px,100%);padding-left:var(--gl);padding-right:var(--gr);display:grid;gap:14px}
.kicker{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--fg)}
.kicker b{color:var(--red);font-family:var(--f-display);font-size:22px;letter-spacing:0;font-weight:900;line-height:1}
.hero-title{margin:0;font-family:var(--f-display);font-weight:900;text-transform:uppercase;font-size:clamp(56px,9vw,132px);line-height:.84;text-wrap:balance;text-shadow:0 4px 30px color-mix(in srgb,var(--black) 50%,transparent)}
.hero-sub{margin:-4px 0 0;font-size:clamp(16px,1.6vw,21px);font-weight:600}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:14px}
.match{color:var(--good);font-weight:700}
.badge{display:inline-block;border:1px solid color-mix(in srgb,var(--fg) 45%,transparent);padding:0 6px;border-radius:3px;font-size:12px;line-height:20px}
.hero-syn{margin:0;max-width:50ch;font-size:clamp(14px,1.25vw,17px);text-shadow:0 1px 12px color-mix(in srgb,var(--black) 70%,transparent)}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:10px;padding:10px 24px 10px 20px;border-radius:4px;font-weight:700;font-size:16px;line-height:1.2;transition:background-color .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn svg{width:22px;height:22px}
.btn-white{background:var(--fg);color:var(--black)}
.btn-white:hover{background:color-mix(in srgb,var(--fg) 78%,transparent)}
.btn-red{background:var(--red);color:var(--fg)}
.btn-red:hover{background:var(--red-hot)}
.btn-ghost{background:color-mix(in srgb,var(--muted) 38%,transparent);color:var(--fg)}
.btn-ghost:hover{background:color-mix(in srgb,var(--muted) 24%,transparent)}
.btn.sm{font-size:14px;padding:7px 14px 7px 12px}
.btn.sm svg{width:18px;height:18px}
.open-to{display:flex;align-items:center;gap:8px;font-size:13px;color:color-mix(in srgb,var(--fg) 85%,transparent)}
.open-to i{width:8px;height:8px;border-radius:50%;background:var(--good)}
@media (max-width:760px){
  .hero{min-height:580px;padding-bottom:110px}
  .hero::after{background:linear-gradient(0deg,var(--bg) 4%,color-mix(in srgb,var(--bg) 55%,transparent) 52%,color-mix(in srgb,var(--bg) 10%,transparent) 100%)}
  .hero-syn{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
}

/* shelves */
.rows{position:relative;z-index:3;display:grid;gap:clamp(20px,2.8vw,40px);margin-top:clamp(-150px,-10vw,-70px);padding-bottom:30px}
.rows.flat{margin-top:0}
.row{display:grid;gap:2px;min-width:0}
.row-title{margin:0;padding-left:var(--gl);padding-right:var(--gr);font-size:clamp(16px,1.5vw,21px);font-weight:600}
.shelf-wrap{position:relative;min-width:0}
.shelf{display:flex;gap:8px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x proximity;scroll-padding-inline:var(--gl);padding:8px var(--gr) 10px var(--gl);scrollbar-width:none}
.shelf::-webkit-scrollbar{display:none}
.shelf-nav{position:absolute;top:8px;bottom:10px;z-index:4;width:max(44px,calc(var(--gl) - 6px));display:grid;place-items:center;opacity:0;transition:opacity .2s}
.shelf-nav svg{width:34px;height:34px}
.shelf-nav.prev{left:0;background:linear-gradient(90deg,color-mix(in srgb,var(--black) 80%,transparent),transparent)}
.shelf-nav.next{right:0;background:linear-gradient(270deg,color-mix(in srgb,var(--black) 80%,transparent),transparent)}
.row:hover .shelf-nav,.shelf-nav:focus-visible{opacity:1}
@media (hover:none){.shelf-nav{display:none}}
.card{position:relative;display:block;aspect-ratio:16/9;max-width:100%;border-radius:4px;overflow:hidden;background:var(--raise);scroll-snap-align:start;transition:transform .18s ease}
.shelf .card{flex:0 0 var(--cw)}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card:hover{transform:translateY(-2px)}
.card-prog{position:absolute;left:0;right:0;bottom:0;padding:18px 8px 7px;display:grid;gap:5px;background:linear-gradient(0deg,color-mix(in srgb,var(--black) 85%,transparent),transparent);text-align:left}
.card-prog small{font-size:12px;font-weight:600}
.bar{display:block;height:3px;background:color-mix(in srgb,var(--fg) 28%,transparent);overflow:hidden}
.bar i{display:block;height:100%;background:var(--red)}
.row[data-kind="top10"]{position:relative;isolation:isolate;padding-block:22px 10px}
.row-bg{position:absolute;inset:0;z-index:-1;background-size:cover;background-position:center 62%;opacity:.45;-webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 22%,#000 76%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0%,#000 22%,#000 76%,transparent 100%)}
.row[data-kind="top10"] .row-title{text-shadow:0 2px 10px color-mix(in srgb,var(--black) 80%,transparent)}
.t10{flex:0 0 calc(var(--cw)*1.06);display:flex;align-items:flex-end;scroll-snap-align:start}
.t10 .rank{flex:1 1 auto;text-align:right;font-family:var(--f-display);font-weight:900;font-size:calc(var(--cw)*.66);line-height:.76;color:color-mix(in srgb,var(--bg) 72%,transparent);-webkit-text-stroke:2px color-mix(in srgb,var(--fg) 70%,transparent);letter-spacing:-.05em;margin-right:-.1em;user-select:none}
.t10 .card{flex:0 0 calc(var(--cw)*.58);aspect-ratio:2/3}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:4px var(--gr) 0 var(--gl)}
.chip{border:1px solid var(--line);background:var(--panel);padding:7px 14px;border-radius:999px;font-size:14px;transition:border-color .15s,background-color .15s}
.chip:hover{border-color:var(--fg);background:var(--raise)}

/* pages */
.page{padding-top:calc(116px + env(safe-area-inset-top,0px));padding-left:var(--gl);padding-right:var(--gr);padding-bottom:24px}
.page-title{margin:0 0 20px;font-family:var(--f-display);font-weight:900;font-size:clamp(32px,4.4vw,52px);line-height:1;text-transform:uppercase;text-wrap:balance}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:18px 10px}
.empty{color:var(--muted);max-width:52ch;margin:0}
.empty-box{border:1px dashed var(--line);border-radius:6px;padding:28px;display:grid;gap:12px;justify-items:start;max-width:560px}
.empty-box h2{margin:0;font-size:18px}
.foot{padding:28px var(--gr) 40px var(--gl);color:var(--muted);font-size:13px;display:grid;gap:6px;border-top:1px solid var(--line);margin-top:20px}
.foot p{margin:0}
.linkish{text-decoration:underline;text-underline-offset:3px;color:var(--fg)}

/* hover preview */
.peek{position:fixed;z-index:45;background:var(--panel);border-radius:6px;overflow:hidden;box-shadow:0 22px 50px color-mix(in srgb,var(--black) 75%,transparent);opacity:0;transform:scale(.88);transition:opacity .18s ease,transform .22s ease;pointer-events:none}
.peek.open{opacity:1;transform:scale(1);pointer-events:auto}
.peek img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;cursor:pointer}
.peek-body{padding:12px 14px 14px;display:grid;gap:10px}
.ib{width:38px;height:38px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;border:2px solid color-mix(in srgb,var(--fg) 55%,transparent);background:color-mix(in srgb,var(--raise) 80%,transparent);color:var(--fg);transition:border-color .15s,background-color .15s}
.ib:hover{border-color:var(--fg)}
.ib svg{width:20px;height:20px}
.ib.white{background:var(--fg);border-color:var(--fg);color:var(--black)}
.ib.white:hover{background:color-mix(in srgb,var(--fg) 80%,transparent)}
.ib.on{border-color:var(--fg)}
.push{margin-left:auto}
.tags{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:13px}
.tags span+span::before{content:"•";color:var(--muted);margin-right:8px}

/* sheets */
.overlay{position:fixed;inset:0;z-index:60;background:color-mix(in srgb,var(--black) 75%,transparent);overflow-y:auto;overscroll-behavior:contain;padding:calc(28px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{max-width:900px;margin:0 auto;background:var(--panel);border-radius:8px;overflow:hidden;box-shadow:0 30px 80px color-mix(in srgb,var(--black) 70%,transparent);animation:rise .28s ease}
@keyframes rise{from{transform:translateY(24px)}to{transform:none}}
.sheet-hero{position:relative;aspect-ratio:16/9;max-height:520px;width:100%}
.sheet-hero>img{width:100%;height:100%;object-fit:cover;display:block}
.sheet-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--panel) 0%,color-mix(in srgb,var(--panel) 0%,transparent) 58%)}
.sheet-close{position:absolute;top:14px;right:14px;z-index:2;background:color-mix(in srgb,var(--black) 70%,transparent);border-color:transparent}
.sheet-hero-body{position:absolute;z-index:1;left:clamp(18px,5vw,48px);right:clamp(18px,5vw,48px);bottom:clamp(14px,3vw,36px);display:grid;gap:14px}
.sheet-title{margin:0;font-family:var(--f-display);font-weight:900;text-transform:uppercase;font-size:clamp(38px,6.4vw,76px);line-height:.86;text-wrap:balance;max-width:14ch}
.sheet-body{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:28px;padding:10px clamp(18px,5vw,48px) 8px}
.sheet-main{display:grid;gap:12px;align-content:start}
.sheet-syn{margin:0;font-size:16px;max-width:60ch}
.role{font-size:15px;font-weight:600}
.role span{color:var(--muted);font-weight:400}
.owned{margin:0;border-left:3px solid var(--red);padding:4px 0 4px 12px;font-size:14px;color:color-mix(in srgb,var(--fg) 88%,transparent);max-width:60ch}
.side{font-size:14px;display:grid;gap:10px;align-content:start}
.side p{margin:0}
.side span,.about .k{color:var(--muted)}
.sec{padding:22px clamp(18px,5vw,48px) 6px}
.sec h3{margin:0 0 12px;font-size:22px;font-weight:700}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.muted{color:var(--muted)}
.ep{display:grid;grid-template-columns:28px 150px minmax(0,1fr);gap:16px;align-items:center;width:100%;text-align:left;padding:16px 14px;border-bottom:1px solid var(--line);border-radius:4px}
.ep:hover{background:var(--raise)}
.ep-num{font-size:22px;color:var(--muted);text-align:center}
.ep-thumb{position:relative;display:grid;place-items:center;aspect-ratio:16/9;border-radius:4px;overflow:hidden;background:var(--raise)}
.ep-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ep-thumb b{position:relative;font-family:var(--f-display);font-weight:900;color:var(--fg);font-size:clamp(20px,2.6vw,30px);line-height:1;text-shadow:0 2px 12px color-mix(in srgb,var(--black) 80%,transparent);padding:0 8px;text-align:center}
.ep-text{display:grid;gap:4px;min-width:0}
.ep-top{display:flex;justify-content:space-between;gap:12px;font-size:15px}
.ep-top span{color:var(--muted);flex:0 0 auto;font-size:13px}
.ep-syn{font-size:13px;color:var(--muted)}
.mlt{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:14px}
.mlt-card{background:var(--raise);border-radius:4px;overflow:hidden;display:grid;align-content:start}
.mlt-art{display:block;width:100%}
.mlt-art img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
.mlt-body{padding:12px 14px 16px;display:grid;gap:10px}
.mlt-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mlt-body p{margin:0;font-size:13px;color:color-mix(in srgb,var(--fg) 82%,transparent);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.about{padding-bottom:34px;display:grid;gap:8px;font-size:14px}
.about h3{font-weight:400}
.about p{margin:0}
@media (max-width:640px){
  .sheet-body{grid-template-columns:1fr;gap:16px}
  .ep{grid-template-columns:110px minmax(0,1fr);gap:12px;padding:12px 6px}
  .ep-num{display:none}
  .sheet-hero{aspect-ratio:4/3}
}
.contact-sheet{max-width:620px}
.contact-sheet .inner{padding:clamp(22px,5vw,40px);display:grid;gap:16px}
.contact-sheet h2{margin:0;font-family:var(--f-display);font-weight:900;font-size:clamp(40px,7vw,60px);line-height:.9;text-transform:uppercase;color:var(--red)}
.contact-sheet .head{display:flex;justify-content:space-between;align-items:start;gap:12px}
.contact-sheet p{margin:0}
.c-list{display:grid;gap:10px}
.c-row{display:grid;grid-template-columns:90px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;background:var(--raise);border-radius:4px}
.c-row span{color:var(--muted);font-size:13px}
.c-row b{font-weight:600;overflow-wrap:anywhere;user-select:all}
.c-row a{font-weight:600;overflow-wrap:anywhere}
@media (max-width:480px){.c-row{grid-template-columns:minmax(0,1fr) auto}.c-row span{grid-column:1/-1}}

/* who's watching */
.gate{position:fixed;inset:0;z-index:90;background:var(--bg);display:grid;place-items:center;padding:calc(76px + env(safe-area-inset-top,0px)) var(--gr) calc(24px + env(safe-area-inset-bottom,0px)) var(--gl);overflow-y:auto;animation:fade .25s ease}
.gate .logo{position:absolute;top:calc(22px + env(safe-area-inset-top,0px));left:var(--gl)}
.gate-inner{display:grid;justify-items:center;gap:clamp(22px,4vw,44px);text-align:center}
.gate h1{margin:0;font-weight:500;font-size:clamp(30px,4.6vw,56px);letter-spacing:-.01em}
.gate-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(14px,2.4vw,30px)}
.gate-tile{display:grid;justify-items:center;gap:10px;width:clamp(120px,14vw,170px);color:var(--muted);transition:color .15s}
.gate-tile .av{width:clamp(96px,11vw,150px);aspect-ratio:1;border:3px solid transparent;transition:border-color .15s}
.gate-tile:hover,.gate-tile:focus-visible{color:var(--fg)}
.gate-tile:hover .av,.gate-tile:focus-visible .av{border-color:var(--fg)}
.gate-tile:focus-visible{outline:none}
.gate-tile b{font-size:clamp(15px,1.4vw,19px);font-weight:600}
.gate-tile small{font-size:12px;line-height:1.35;margin-top:-6px;max-width:16ch}
.gate-note{color:var(--muted);font-size:13px;margin:0;max-width:44ch}

/* trailer player */
.sp{position:fixed;inset:0;z-index:80;background:var(--black);color:var(--fg);overflow:hidden}
.sp-stage{position:absolute;inset:0;overflow:hidden}
.sp-art{position:absolute;top:-4%;left:-4%;width:108%;height:108%;max-width:none;object-fit:cover;opacity:0;transition:opacity 1.2s ease;animation:drift 22s ease-in-out infinite alternate}
.sp-art.on{opacity:.6}
@keyframes drift{from{transform:scale(1) translate(0,0)}to{transform:scale(1.08) translate(-2%,-1.5%)}}
.sp.paused .sp-art{animation-play-state:paused}
.sp-stage::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,color-mix(in srgb,var(--black) 88%,transparent) 0%,color-mix(in srgb,var(--black) 40%,transparent) 60%,transparent 100%),linear-gradient(0deg,color-mix(in srgb,var(--black) 90%,transparent) 0%,transparent 35%)}
.sp-slide{position:absolute;left:var(--gl);right:var(--gr);top:50%;transform:translateY(-54%);max-width:900px;display:grid;gap:14px;pointer-events:none}
.sp-slide>*{animation:slideIn .55s ease both}
.sp-slide>*:nth-child(2){animation-delay:.08s}
.sp-slide>*:nth-child(3){animation-delay:.16s}
.sp-slide>*:nth-child(4){animation-delay:.24s}
.sp-slide>*:nth-child(5){animation-delay:.32s}
@keyframes slideIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.sp-kick{font-size:13px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}

.sp-title{font-family:var(--f-display);font-weight:900;text-transform:uppercase;font-size:clamp(60px,10vw,150px);line-height:.84;text-wrap:balance}
.sp-end{pointer-events:auto}
.sp-ui{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none;padding:max(14px,env(safe-area-inset-top,0px)) var(--gr) max(14px,env(safe-area-inset-bottom,0px)) var(--gl);transition:opacity .35s}

.sp-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sp-tag{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.pc{width:46px;height:46px;display:grid;place-items:center;border-radius:4px;transition:background-color .15s,transform .1s;flex:0 0 auto}
.pc:hover{background:color-mix(in srgb,var(--fg) 12%,transparent);transform:scale(1.06)}

.sp-bottom{display:grid;gap:8px}
.segs{display:flex;gap:4px}
.seg{flex:1;height:16px;display:flex;align-items:center}
.seg span{display:block;width:100%;height:4px;background:color-mix(in srgb,var(--fg) 25%,transparent);overflow:hidden}

    html=`<section class="page" style="padding-bottom:0"><h1 class="page-title">Credentials</h1></section><div class="rows flat">${[d.certs,d.edu].map(r=>rowHTML(...r)).join('')}${chipsHTML()}</div>`;
  }else{
    const hero=byId[(lens||LENSES[3]).hero];
    html=heroHTML(hero)+`<div class="rows">${homeRows().map(r=>rowHTML(...r)).join('')}${chipsHTML()}</div>`;
  }
  main.innerHTML=html+footerHTML();
}
function renderNav(){
  $$('.tab').forEach(b=>{if(b.dataset.tab===view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  const L=lens||LENSES[3];
  avBtn.innerHTML=`<span class="av" style="--c:${L.c}">${ICON[L.icon]}</span>${ICON.down}`;
  avBtn.setAttribute('aria-label',`Viewer menu, watching as ${L.name}`);
}
function setView(v){query='';searchInput.value='';searchBox.classList.remove('open');view=v;renderNav();renderMain();window.scrollTo({top:0})}
function setLens(id){lens=LENSES.find(l=>l.id===id)||LENSES[3];store.set('hr:lens',lens.id);view='home';query='';searchInput.value='';renderNav();renderMain();window.scrollTo({top:0})}

/* ---------- hover preview ---------- */
const canHover=matchMedia('(hover: hover) and (pointer: fine)').matches;
let peekTimer=0,peekHide=0,peekCard=null;
function showPeek(card){
  const t=byId[card.dataset.card];if(!t)return;const r=card.getBoundingClientRect();if(r.right<0||r.left>innerWidth)return;
  const w=Math.max(r.width*1.5,320),ih=w*9/16;
  const left=Math.min(Math.max(8,r.left+r.width/2-w/2),innerWidth-w-8);
  const top=Math.max(76,Math.min(r.top+r.height/2-ih/2-12,innerHeight-ih-170));
  Object.assign(peek.style,{width:w+'px',left:left+'px',top:top+'px',transformOrigin:`${r.left+r.width/2-left}px ${r.top+r.height/2-top}px`});
  peek.innerHTML=`<img src="${art(t)}" alt="" data-info="${t.id}">
  <div class="peek-body">
    <div class="actions">${playable(t)?`<button class="ib white" data-play="${t.id}" aria-label="Play trailer for ${esc(t.title)}">${ICON.play}</button>`:''}${listBtn(t.id)}<button class="ib push" data-info="${t.id}" aria-label="More info about ${esc(t.title)}">${ICON.down}</button></div>
    <div class="meta"><span class="match">${matchOf(t)}% match</span><span class="badge">${esc(t.type==='cert'?t.org:(t.role||t.org))}</span><span>${typeLabel(t)}</span></div>
    ${t.type==='cert'?`<div class="tags"><span>${esc(t.full)}</span></div>`:tagsHTML(t)}
  </div>`;
  peekCard=card;peek.setAttribute('aria-hidden','false');requestAnimationFrame(()=>peek.classList.add('open'));
}
function hidePeek(){clearTimeout(peekTimer);clearTimeout(peekHide);peek.classList.remove('open');peek.setAttribute('aria-hidden','true');peekCard=null}
main.addEventListener('mouseover',e=>{if(!canHover)return;const card=e.target.closest('.card');if(!card||card===peekCard)return;clearTimeout(peekTimer);clearTimeout(peekHide);if(peekCard)hidePeek();peekTimer=setTimeout(()=>showPeek(card),430)});
main.addEventListener('mouseout',e=>{const card=e.target.closest('.card');if(!card||card.contains(e.relatedTarget))return;clearTimeout(peekTimer);if(e.relatedTarget&&peek.contains(e.relatedTarget))return;if(peekCard){clearTimeout(peekHide);peekHide=setTimeout(hidePeek,140)}});
peek.addEventListener('mouseenter',()=>clearTimeout(peekHide));
peek.addEventListener('mouseleave',e=>{if(peekCard&&peekCard.contains(e.relatedTarget))return;peekHide=setTimeout(hidePeek,120)});
addEventListener('scroll',()=>{hidePeek();if(view==='home'||view==='experience'||view==='cases')topEl.classList.toggle('solid',scrollY>40)},{passive:true});
main.addEventListener('scroll',hidePeek,true);

/* ---------- sheets ---------- */
let lastFocus=null;
function similar(t){
  const p=pool().filter(x=>x!==t&&(t.type==='cert'?x.type==='cert':x.type!=='cert'));
  return p.map(x=>[x,x.tags.filter(g=>t.tags.includes(g)).length+(x.type===t.type?0.5:0)]).sort((a,b)=>b[1]-a[1]||matchOf(b[0])-matchOf(a[0])).slice(0,6).map(([x])=>x);
}
function openSheet(html,labelId){
  hidePeek();closeMenu();if(detail.hidden)lastFocus=document.activeElement;
  detail.setAttribute('aria-labelledby',labelId);detail.innerHTML=html;detail.hidden=false;detail.scrollTop=0;document.body.classList.add('locked');
  $('[data-close]',detail).focus({preventScroll:true});
}
function closeDetail(restore=true){
  if(detail.hidden)return;detail.hidden=true;detail.innerHTML='';
  if(sp.hidden&&gate.hidden)document.body.classList.remove('locked');
  if(restore&&lastFocus&&document.contains(lastFocus))lastFocus.focus({preventScroll:true});
}
function openDetail(id){
  const t=byId[id];if(!t)return;const isMe=id==='harsha';
  const eps=(t.eps||[]).map((ep,i)=>`<button class="ep" data-ep="${t.id}|${i+1}" aria-label="Play from episode ${i+1}, ${esc(ep[0])}"><span class="ep-num">${i+1}</span><span class="ep-thumb"><img src="${art(t,{w:320,h:180,text:false,seed:'ep'+i})}" alt=""><b>${esc(ep[1])}</b></span><span class="ep-text"><span class="ep-top"><b>${esc(ep[0])}</b><span>${esc(ep[2])}</span></span><span class="ep-syn">${esc(ep[3])}</span></span></button>`).join('');
  const roleLine=t.type==='cert'?`<p class="role">${esc(t.full)} <span>· issued by ${esc(t.org)}</span></p>`:t.type==='doc'?`<p class="role">${esc(t.org)} <span>· ${esc(t.dates)}</span></p>`:isMe?`<p class="role">${esc(t.sub)} <span>· ${esc(CONTACT.location)}</span></p>`:`<p class="role">${esc(t.role)}, ${esc(t.org)} <span>· ${esc(t.dates)}${t.loc?` · ${esc(t.loc)}`:''}</span></p>`;
  const more=similar(t);
  openSheet(`<div class="sheet">
  <div class="sheet-hero"><img src="${art(t,{w:1600,h:900,text:false})}" alt="">
    <button class="ib sheet-close" data-close aria-label="Close">${ICON.x}</button>
    <div class="sheet-hero-body">
      <span class="kicker"><b>H</b>${esc(isMe?'The Series':t.org)}</span>
      <h2 class="sheet-title" id="sheet-title">${esc(t.title)}</h2>
      <div class="actions">${playable(t)?`<button class="btn btn-white" data-play="${t.id}">${ICON.play}${S.progress[t.id]?'Resume':'Play trailer'}</button>`:''}${isMe?`<button class="btn btn-red" data-contact>${ICON.mail}Contact</button>`:''}${listBtn(t.id)}</div>
    </div>
  </div>
  <div class="sheet-body">
    <div class="sheet-main">
      <div class="meta"><span class="match">${matchOf(t)}% match</span><span>${typeLabel(t)}</span>${t.facts?`<span class="badge">${esc(t.facts)}</span>`:''}</div>
      ${roleLine}
      <p class="sheet-syn">${esc(t.syn)}</p>
      ${t.owned?`<p class="owned">${esc(t.owned)}</p>`:''}
    </div>
    <aside class="side">
      ${t.skills.length?`<p><span>Skills:</span> ${esc(t.skills.join(', '))}</p>`:''}
      ${t.tools.length?`<p><span>Tools:</span> ${esc(t.tools.join(', '))}</p>`:''}
      <p><span>Filed under:</span> ${esc(t.tags.join(', '))}</p>
    </aside>
  </div>
  ${eps?`<section class="sec"><div class="sec-head"><h3>${t.type==='film'?'Key beats':'Episodes'}</h3><span class="muted">${t.eps.length} ${t.type==='film'?'beats':'episodes'}</span></div>${eps}</section>`:''}
  ${more.length?`<section class="sec"><h3>More like this</h3><div class="mlt">${more.map(x=>`<article class="mlt-card"><button class="mlt-art" data-info="${x.id}" aria-label="More info about ${esc(x.title)}"><img src="${art(x)}" alt=""></button><div class="mlt-body"><div class="mlt-top"><div class="meta"><span class="match">${matchOf(x)}%</span><span>${typeLabel(x)}</span></div>${listBtn(x.id)}</div><p>${esc(x.syn)}</p></div></article>`).join('')}</div></section>`:''}
  <section class="sec about"><h3>About <b>${esc(t.full||t.title)}</b></h3>
    ${t.type==='cert'?`<p><span class="k">Issuer:</span> ${esc(t.org)}</p>`:`<p><span class="k">${t.type==='doc'?'Institution':'Company'}:</span> ${esc(isMe?'IBM, Cybage Software':t.org)}</p>`}
    ${t.role?`<p><span class="k">Role:</span> ${esc(t.role)}</p>`:''}
    ${t.dates&&t.type!=='cert'?`<p><span class="k">When:</span> ${esc(t.dates)}</p>`:''}
    <p><span class="k">Contact:</span> ${esc(CONTACT.email)}</p>
  </section>
</div>`,'sheet-title');
}
function openContact(){
  openSheet(`<div class="sheet contact-sheet"><div class="inner">
   <div class="head"><h2 id="contact-title">Let's talk</h2><button class="ib" data-close aria-label="Close">${ICON.x}</button></div>
   <p>Harsha Reddy, Product Manager – Technical. ${esc(CONTACT.location)}.</p>
   <div class="c-list">
    <div class="c-row"><span>Email</span><b>${esc(CONTACT.email)}</b><button class="btn btn-ghost sm" data-copy="${esc(CONTACT.email)}">Copy</button></div>
    <div class="c-row"><span>Phone</span><b>${esc(CONTACT.phone)}</b><button class="btn btn-ghost sm" data-copy="${esc(CONTACT.phone)}">Copy</button></div>
    <div class="c-row"><span>LinkedIn</span><a href="https://${CONTACT.linkedin}" target="_blank" rel="noopener">${esc(CONTACT.linkedin)}</a><button class="btn btn-ghost sm" data-copy="https://${esc(CONTACT.linkedin)}">Copy</button></div>
   </div>
   <p class="muted">Résumé available on request.</p>
  </div></div>`,'contact-title');
}
detail.addEventListener('click',e=>{if(e.target===detail)closeDetail()});
async function copyText(txt,btn){
  try{await navigator.clipboard.writeText(txt);btn.textContent='Copied';toast('Copied to clipboard')}
  catch(e){const b=btn.previousElementSibling;if(b){const r=document.createRange();r.selectNodeContents(b);const s=getSelection();s.removeAllRanges();s.addRange(r)}toast('Selected. Press Ctrl+C or Cmd+C to copy.')}
}

/* shortlist */
function toggleList(id){
  const i=S.list.indexOf(id);if(i>-1)S.list.splice(i,1);else S.list.unshift(id);save();
  const on=i===-1;
  $$(`[data-list="${id}"]`).forEach(b=>{b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);b.setAttribute('aria-label',on?'Remove from Shortlist':'Add to Shortlist');b.innerHTML=on?ICON.check:ICON.plus});
  if(!sp.hidden)syncSpList();
  toast(on?`Added ${byId[id].title} to your shortlist`:`Removed ${byId[id].title} from your shortlist`);
  if(view==='list'&&detail.hidden)renderMain();
  else if(view==='home'){
    const row=$('.row[data-kind="mylist"]',main);const items=S.list.map(x=>byId[x]).filter(Boolean);
    if(row){if(items.length)row.outerHTML=rowHTML('Your shortlist',items,'mylist');else row.remove()}
    else if(items.length){const rows=$$('.rows>.row',main).filter(r=>r.dataset.kind!=='cont');if(rows[1])rows[1].insertAdjacentHTML('afterend',rowHTML('Your shortlist',items,'mylist'))}
  }
}

/* viewer menu & gate */
function openMenu(){
  const L=lens||LENSES[3];
  menu.innerHTML=`${LENSES.filter(l=>l!==L).map(l=>`<button class="mi" role="menuitem" data-lens="${l.id}"><span class="av" style="--c:${l.c}">${ICON[l.icon]}</span>${esc(l.name)}</button>`).join('')}
  <hr><p class="note">Watching as <b>${esc(L.name)}</b><br>${esc(L.note)}</p>
  <button class="mi" role="menuitem" data-contact>Contact Harsha</button>`;
  menu.hidden=false;avBtn.setAttribute('aria-expanded','true');$('.mi',menu).focus({preventScroll:true});
}
function closeMenu(){if(menu.hidden)return;menu.hidden=true;avBtn.setAttribute('aria-expanded','false')}
function openGate(){
  closeMenu();hidePeek();closeDetail(false);
  gate.innerHTML=`<span class="logo">Harsha Reddy</span><div class="gate-inner"><h1>Who's watching?</h1>
   <div class="gate-grid">${LENSES.map(l=>`<button class="gate-tile" data-lens="${l.id}"><span class="av" style="--c:${l.c}">${ICON[l.icon]}</span><b>${esc(l.name)}</b><small>${esc(l.note)}</small></button>`).join('')}</div>
   <p class="gate-note">Pick a viewer and the portfolio reorders itself for what you care about. You can switch any time from the top-right menu.</p></div>`;
  gate.hidden=false;document.body.classList.add('locked');
  const cur=$(`[data-lens="${(lens||LENSES[0]).id}"]`,gate);if(cur)cur.focus({preventScroll:true});
}
function closeGate(){gate.hidden=true;if(detail.hidden&&sp.hidden)document.body.classList.remove('locked')}

/* ---------- trailer player ---------- */
const spA=$('#sp-a'),spB=$('#sp-b'),spSlide=$('#sp-slide'),spSegs=$('#sp-segs'),spToggle=$('#sp-toggle'),spList=$('#sp-list');
$('#sp-back').innerHTML=ICON.back;$('#sp-prev').innerHTML=ICON.prev;$('#sp-next').innerHTML=ICON.next;$('#sp-contact').innerHTML=ICON.mail;
const SLIDE_MS=6500;
const P={t:null,slides:[],i:0,el:0,playing:false,raf:0,last:0,layer:0};
function slidesFor(t){return[{k:'title'},...t.eps.map((e,i)=>({k:'beat',i,e})),{k:'end'}]}
function nextTitle(t){const order=[byId.harsha,...pool().filter(x=>playable(x))];const i=order.indexOf(t);return order[(i+1)%order.length]}
function spArt(n){
  const src=art(P.t,{w:1280,h:720,text:false,seed:'sp'+n});
  const show=P.layer?spA:spB,hide=P.layer?spB:spA;show.src=src;show.classList.add('on');hide.classList.remove('on');P.layer^=1;
}
function renderSlide(){
  const t=P.t,s=P.slides[P.i];let h='';
  if(s.k==='title'){
    h=`<span class="sp-kick"><em>H</em>&nbsp; ${esc(t.id==='harsha'?'The Series':t.org)}</span><div class="sp-title">${esc(t.title)}</div><div class="sp-label">${esc(t.id==='harsha'?t.sub:(t.role?`${t.role} · ${t.dates}`:t.dates))}</div><p class="sp-body">${esc(t.syn)}</p>`;
  }else if(s.k==='beat'){
    const[title,metric,label,body]=s.e;const word=!/[0-9$%]/.test(metric)||metric.length>9;
    h=`<span class="sp-kick">${t.type==='film'?'Beat':'Episode'} ${s.i+1} · <em>${esc(title)}</em></span><div class="sp-metric${word?' word':''}">${esc(metric)}</div><div class="sp-label">${esc(label)}</div><p class="sp-body">${esc(body)}</p>`;
  }else{
    const n=nextTitle(t);
    h=`<span class="sp-kick">End of trailer</span><div class="sp-title" style="font-size:clamp(44px,7vw,96px)">Want the full story?</div><p class="sp-body">Every number here comes with the how behind it. Happy to walk through any of them.</p><div class="actions sp-end"><button class="btn btn-red" data-contact>${ICON.mail}Contact Harsha</button><button class="btn btn-ghost" data-play="${n.id}">${ICON.next}Next: ${esc(n.title)}</button></div>`;
  }
  spSlide.innerHTML=h;
  spSegs.innerHTML=P.slides.map((_,k)=>`<button class="seg" data-seg="${k}" aria-label="Go to part ${k+1} of ${P.slides.length}"><span><i style="width:${k<P.i?100:0}%"></i></span></button>`).join('');
  $('#sp-prev').disabled=P.i===0;$('#sp-next').disabled=P.i===P.slides.length-1;
  $('#sp-sub').textContent=s.k==='beat'?s.e[0]:(s.k==='end'?'The end':'');
  spArt(P.i);
}
function goSlide(i){P.i=Math.max(0,Math.min(P.slides.length-1,i));P.el=0;renderSlide();if(P.i===P.slides.length-1)setPlaying(false)}
function setPlaying(on){P.playing=on;sp.classList.toggle('paused',!on);spToggle.innerHTML=on?ICON.pause:ICON.play;spToggle.setAttribute('aria-label',on?'Pause':'Play')}
function syncSpList(){const on=S.list.includes(P.t.id);spList.innerHTML=on?ICON.check:ICON.plus;spList.setAttribute('aria-pressed',on);spList.setAttribute('aria-label',on?'Remove from Shortlist':'Add to Shortlist')}
function tick(now){
  const dt=Math.min(250,now-P.last);P.last=now;
  if(P.playing&&P.i<P.slides.length-1){P.el+=dt;if(P.el>=SLIDE_MS){goSlide(P.i+1)}}
  const bar=$(`[data-seg="${P.i}"] i`,spSegs);if(bar)bar.style.width=(P.i===P.slides.length-1?100:Math.min(100,P.el/SLIDE_MS*100))+'%';
  P.raf=requestAnimationFrame(tick);
}
function play(id,start){
  const t=byId[id];if(!t||!playable(t))return;
  hidePeek();closeDetail(false);closeMenu();
  P.t=t;P.slides=slidesFor(t);
  let i=start!=null?start:(S.progress[id]?.i||0);if(i>=P.slides.length-1)i=0;
  sp.hidden=false;document.body.classList.add('locked');
  $('#sp-title').textContent=t.title;syncSpList();
  goSlide(i);setPlaying(true);
  P.last=performance.now();cancelAnimationFrame(P.raf);P.raf=requestAnimationFrame(tick);
  spToggle.focus({preventScroll:true});
}
function saveProgress(){
  const t=P.t;if(!t)return;
  if(P.i>0&&P.i<P.slides.length-1)S.progress[t.id]={i:P.i,at:Date.now()};else delete S.progress[t.id];save();
}
function closePlayer(){
  saveProgress();cancelAnimationFrame(P.raf);sp.hidden=true;P.playing=false;
  if(detail.hidden&&gate.hidden)document.body.classList.remove('locked');
  const y=scrollY;renderMain();window.scrollTo({top:y});
}
spToggle.addEventListener('click',()=>setPlaying(!P.playing));
$('#sp-prev').addEventListener('click',()=>goSlide(P.i-1));
$('#sp-next').addEventListener('click',()=>goSlide(P.i+1));
$('#sp-back').addEventListener('click',closePlayer);
spList.addEventListener('click',()=>toggleList(P.t.id));
$('#sp-contact').addEventListener('click',()=>{setPlaying(false);openContact()});
$('#sp-stage').addEventListener('click',e=>{const x=e.clientX/innerWidth;if(x<0.3)goSlide(P.i-1);else goSlide(P.i+1)});

/* ---------- global events ---------- */
document.addEventListener('click',e=>{
  if(!menu.hidden&&!e.target.closest('#menu')&&!e.target.closest('#av-btn'))closeMenu();
  const el=e.target.closest('button,[data-info],[data-play]');if(!el)return;
  const d=el.dataset;
  if(el===avBtn){menu.hidden?openMenu():closeMenu();return}
  if(el.id==='logo'){setView('home');return}
  if(d.tab){setView(d.tab);return}
  if(d.lens){closeMenu();closeGate();setLens(d.lens);return}
  if(d.gate!==undefined){openGate();return}
  if(d.contact!==undefined){if(!sp.hidden)setPlaying(false);openContact();return}
  if(d.copy){copyText(d.copy,el);return}
  if(d.close!==undefined){closeDetail();return}
  if(d.play){if(!sp.hidden&&P.t)saveProgress();play(d.play,el.closest('.sp-end')?0:undefined);return}
  if(d.ep){const[id,n]=d.ep.split('|');play(id,+n);return}
  if(d.seg){goSlide(+d.seg);return}
  if(d.list){toggleList(d.list);return}
  if(d.info){openDetail(d.info);return}
  if(d.card){if(d.resume)play(d.card);else openDetail(d.card);return}
  if(d.skill){searchBox.classList.add('open');searchInput.value=d.skill;searchInput.dispatchEvent(new Event('input'));window.scrollTo({top:0});return}
  if(d.dir){const shelf=$('.shelf',el.parentElement);shelf.scrollBy({left:+d.dir*shelf.clientWidth*0.85,behavior:reduceMotion?'auto':'smooth'});return}
});
$('#search-btn').addEventListener('click',()=>{if(searchBox.classList.contains('open')&&!searchInput.value){searchBox.classList.remove('open');return}searchBox.classList.add('open');searchInput.focus()});
searchInput.addEventListener('input',()=>{
  query=searchInput.value;
  if(query.trim()){if(view!=='search'){prevView=view;view='search';window.scrollTo({top:0})}}
  else if(view==='search')view=prevView;
  renderNav();renderMain();
});
searchInput.addEventListener('blur',()=>{if(!searchInput.value)searchBox.classList.remove('open')});
document.addEventListener('keydown',e=>{
  if(!sp.hidden&&detail.hidden){
    if(e.key===' '&&e.target.tagName!=='BUTTON'){e.preventDefault();setPlaying(!P.playing)}
    else if(e.key==='ArrowRight'){e.preventDefault();goSlide(P.i+1)}
    else if(e.key==='ArrowLeft'){e.preventDefault();goSlide(P.i-1)}
    else if(e.key==='Escape')closePlayer();
    return;
  }
  if(e.key==='Escape'){
    if(!detail.hidden){closeDetail();return}
    if(!gate.hidden&&lens){closeGate();return}
    if(!menu.hidden){closeMenu();avBtn.focus();return}
    if(document.activeElement===searchInput){searchInput.value='';searchInput.dispatchEvent(new Event('input'));searchInput.blur();searchBox.classList.remove('open')}
    return;
  }
  if(e.key==='/'&&detail.hidden&&gate.hidden&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();searchBox.classList.add('open');searchInput.focus()}
});

/* ---------- boot ---------- */
async function boot(){
  let fontsOk=false;
  try{await Promise.race([Promise.all(['900 40px "Big Shoulders Display"','400 40px "DM Serif Display"','700 20px "Instrument Sans"'].map(f=>document.fonts.load(f))).then(()=>{fontsOk=true}),new Promise(r=>setTimeout(r,1500))])}catch(e){}
  S=Object.assign({list:[],progress:{}},store.get('hr:state',{}));
  const saved=store.get('hr:lens',null);
  lens=LENSES.find(l=>l.id===saved)||null;
  renderNav();renderMain();
  if(!lens)openGate();
  if(!fontsOk&&document.fonts)document.fonts.ready.then(()=>{artCache.clear();if(sp.hidden&&detail.hidden){const y=scrollY;renderMain();window.scrollTo({top:y})}});
}
boot();
})();
</script>
