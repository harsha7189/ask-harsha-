  }

  // ----- "Ask Harsha TV": a channel screen, tonight's guide and a remote you can spin -----
  // Channels: All chats, one per project, and My List (saved answers). Episodes are chats (or saved answers).
  // ▲▼ or spinning the dial changes channel, ◀▶ moves between episodes, OK plays (opens) the one on screen.
  // The four color keys open Projects, Tools, Saved and Customize, like the colored buttons on a real remote.
  const HUES=['#4ef0c0','#9d8cff','#ff7eb3','#ffb84d','#5cb8ff','#b8f35e','#ff9a5c','#62e6ff'];
  let tvState=(()=>{try{return JSON.parse(sessionStorage.getItem('askh_tv')||'{}')}catch(e){return {}}})();
  let tvEls=null;
  function channels(){
    if(!signedIn())return [{id:'welcome',name:me.enabled?'Welcome':'Ask Harsha',icon:'👋',eps:[],kind:'welcome',hue:HUES[0]}];
    const byTime=(a,b)=>(a.created||a.updated)-(b.created||b.updated);
    const list=[{id:'all',name:'All chats',icon:'📺',eps:[...summaries].sort(byTime),kind:'chats'}];
    projects.forEach(p=>list.push({id:p.id,name:p.name,icon:p.icon,eps:summaries.filter(c=>c.project===p.id).sort(byTime),kind:'chats',project:p}));
    list.push({id:'saved',name:'My List',icon:'★',eps:[...savedItems].sort((a,b)=>a.created-b.created),kind:'saved'});
    return list.map((c,i)=>({...c,no:i+1,hue:HUES[i%HUES.length]}));
  }
  function tvHome(){
    dr.classList.add('tvmode');
    homeTop();cmdBar();
    const chs=channels();
    // Open on the chat that's on screen; otherwise on the last channel you watched, at its newest episode.
    let ch=Math.max(0,chs.findIndex(c=>c.id===tvState.ch)),ep=Math.max(0,chs[ch].eps.length-1);
    if(cur){
      const has=c=>c.kind==='chats'&&c.eps.some(e=>e.id===cur.id);
      if(!has(chs[ch]))ch=Math.max(0,chs.findIndex(has));
      const i=chs[ch].eps.findIndex(e=>e.id===cur.id);if(i>=0)ep=i;
    }

    // the screen
    const screen=el('section','tv-screen');screen.setAttribute('aria-live','polite');
    const bar=el('div','tv-bar'),lcd=el('span','tv-lcd'),cname=el('span','tv-chname'),live=el('span','tv-live'),clock=el('span','tv-clock');
    bar.append(lcd,cname,live,clock);
    const stage=el('div','tv-stage'),epnav=el('div','tv-epnav');
    screen.append(bar,stage,epnav,el('div','tv-scan'),el('div','tv-noise'));
    view.append(screen);

    // tonight's guide
    const gwrap=el('section','tv-guide');const gh=el('div','tv-gh');gh.append(el('b',null,'Guide'),el('small',null,signedIn()?'Last 7 days · tap a show to tune in':'Sign in to start recording your chats'));
    const grid=el('div','tv-grid');gwrap.append(gh,grid);view.append(gwrap);

    // the morphing remote: a glass capsule with a touch lens in the middle and context keys that change with what's on screen
    // Lens: swipe ↑↓ channels, ←→ episodes, tap to play, hold to talk (release to send), circle the rim to scrub.
    const rm=el('section','mr');rm.setAttribute('aria-label','Remote');
    const cap=el('div','mr-cap');const aur=el('div','mr-aurora');cap.append(aur);
    const pl=el('div','mr-petals'),pr=el('div','mr-petals');
    const lens=el('div','mr-lens');lens.tabIndex=0;lens.setAttribute('role','button');
    lens.setAttribute('aria-label','Touch lens. Swipe up or down to change channel, left or right for episodes, tap to play, hold to talk.');
    const trail=el('canvas','mr-trail'),glow=el('span','mr-glow'),rim=el('span','mr-rim'),face=el('span','mr-face');
    const lch=el('b','mr-ch'),lhint=el('small','mr-hint','swipe · tap · hold to talk');face.append(lch,lhint);
    const arrow=el('span','mr-arrow');lens.append(rim,trail,glow,face,arrow);
    cap.append(pl,lens,pr);
    const dock=el('nav','mr-dock');dock.setAttribute('aria-label','Sections');
    [['projects','Projects','#ff5a6e'],['tools','Tools','#39d98a'],['saved','Saved','#ffc93c'],['customize','Customize','#4da3ff']].forEach(([id,name,c])=>{
      const b=el('button','mr-dk');b.type='button';b.style.setProperty('--k',c);const ic=el('span','ic');ic.innerHTML=SB_ICONS[id];
      b.append(ic,el('small',null,name));b.onclick=()=>{buzz();go(id)};dock.append(b)});
    dock.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;[...dock.children].forEach(b=>{const r=b.getBoundingClientRect();const d=Math.abs(e.clientX-(r.left+r.width/2));b.style.setProperty('--m',Math.max(0,1-d/120).toFixed(3))})});
    dock.addEventListener('pointerleave',()=>[...dock.children].forEach(b=>b.style.setProperty('--m',0)));
    const grip=el('button','mr-grip');grip.type='button';
    const mini=()=>{try{return localStorage.getItem('askh_remote_mini')==='1'}catch(e){return false}};
    const setMini=v=>{rm.classList.toggle('mini',v);grip.setAttribute('aria-label',v?'Show the full remote':'Tuck the remote away');grip.setAttribute('aria-expanded',!v);try{localStorage.setItem('askh_remote_mini',v?'1':'0')}catch(e){}};
    grip.onclick=()=>setMini(!rm.classList.contains('mini'));setMini(mini());
    rm.append(grip,cap,dock);view.append(rm);

    function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms||6)}catch(e){}}
    function flash(dir){arrow.className='mr-arrow '+dir;void arrow.offsetWidth;arrow.classList.add('go')}
    // context keys: what makes sense for the thing on screen
    let petalSig='';
    function petals(){

          cmdUI.inp.value='';go('project',p.id);toast(say||`Project “${p.name}” is ready.`)}catch(e){cmdSay(e.message,'err')}return}
      case 'search_chats':{
        if(needAccount())return;
        let hits=[];try{hits=(await api('GET','/api/chats?q='+encodeURIComponent(a.query))).chats||[]}catch(e){}
        results(hits.map(c=>({t:c.title,s:highlight(c),on:()=>{close();openChat(c.id)}})),say||`Chats about “${a.query}”`,`No chats about “${a.query}” yet.`);return}
      case 'search_saved':{
        if(needAccount())return;
        const words=a.query.toLowerCase().split(/\s+/).filter(w=>w.length>2);
        const hits=savedItems.filter(s=>{const t=(s.question+' '+(s.data.answer||'')).toLowerCase();return words.some(w=>t.includes(w))});
        results(hits.map(s=>({t:s.question||'Saved answer',s:cleanLine(s.data.answer).slice(0,110),on:()=>{if(s.chat_id&&summaries.some(c=>c.id===s.chat_id)){close();openChat(s.chat_id)}else go('saved')}})),say||`Saved answers about “${a.query}”`,`Nothing saved about “${a.query}” yet.`);return}
      default:cmdSay(say||'I’m not sure how to do that yet.',d.action==='reply'?'':'err');
    }
  }

  function listenCmd(onState){
    if(!cmdUI)return;
    const R=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!R){cmdSay("Voice commands aren't available in this browser. Type instead.",'err');cmdUI.inp.focus();return}
    if(cmdRec){try{cmdRec.stop()}catch(e){}return}
    const rec=new R();cmdRec=rec;rec.lang=navigator.language||'en-US';rec.interimResults=true;rec.continuous=false;
    const {inp,mic}=cmdUI;let said='';mic.classList.add('on');if(onState)onState(true);inp.placeholder='Listening… say what you need';cmdSay('Listening…','busy');
    rec.onresult=e=>{said=[...e.results].map(r=>r[0].transcript).join(' ');inp.value=said};
    rec.onerror=e=>{if(e.error==='not-allowed')cmdSay('Allow the microphone for this site to use voice commands.','err')};
    rec.onend=()=>{cmdRec=null;mic.classList.remove('on');if(onState)onState(false);inp.placeholder='Tell the remote what you need…';if(said.trim())runCmd(said);else if(cmdUI.out.querySelector('.busy'))suggest()};
    try{rec.start()}catch(e){cmdRec=null;mic.classList.remove('on');if(onState)onState(false)}
  }

async function runFactCheck(wrap,btn,answer){
  btn.disabled=true;btn.textContent='Fact-checking…';
  const panel=el('div','fc'),head=el('div','fchead'),list=el('ol','fclist'),foot=el('div','fcfoot');
  head.append(el('span','fcspin'),el('span',null,'Finding the claims…'));panel.append(head,list,foot);
  wrap.querySelector('.fc')?.remove();wrap.append(panel);scrollDown();
  const rows={};let done=false;
  const setHead=t=>{head.textContent='';head.append(el('span','fcspin'),el('span',null,t+'…'))};
  try{
    const res=await fetch('/api/factcheck/stream',{method:'POST',headers:headers(),body:JSON.stringify({answer})});
    const type=res.headers.get('content-type')||'';
    if(!res.ok||!type.includes('text/event-stream')){const d=await res.json().catch(()=>({}));throw new Error(d.message||'The fact check could not start.')}
    await readSSE(res,(kind,d)=>{
      if(kind==='status')setHead(d.label);
      else if(kind==='claims'){
        if(!d.claims.length){head.textContent="This answer doesn't contain any checkable claims.";done=true;return}
        d.claims.forEach(c=>{const li=el('li','fcrow pending');const ic=el('span','fcmark','·');const bodyEl=el('div','fcbody');bodyEl.append(el('div','fcclaim',c.text));li.append(ic,bodyEl);list.append(li);rows[c.id]={li,ic,bodyEl}});
        scrollDown();
      }
      else if(kind==='verdicts'){
        Object.entries(d.record_texts||{}).forEach(([id,t])=>{cache[id]={text:t,kind:id.startsWith('N')?'note':'fact'}});
        d.verdicts.forEach(v=>{const r=rows[v.id];if(!r)return;const V=VERDICT[v.verdict]||VERDICT.unverified;
          r.li.className='fcrow '+V.cls;r.ic.textContent=V.mark;r.ic.setAttribute('aria-label',V.word);
          const ex=el('div','fcwhy');ex.append(el('b',null,V.word+'. '),v.explanation||'');r.bodyEl.append(ex);
          if(v.sources&&v.sources.length){const sr=el('div','sources');v.sources.forEach(src=>{
            if(src.type==='web'){let host='';try{host=new URL(src.url).hostname.replace(/^www\./,'')}catch(e){}const a=el('a','src',host||src.url);a.href=src.url;a.target='_blank';a.rel='noopener';sr.append(a)}
            else{const b=el('button','cite'+(src.id.startsWith('N')?' note':''),src.id);b.type='button';b.onclick=()=>openSource(src.id);sr.append(b)}});r.bodyEl.append(sr)}
        });
      }
      else if(kind==='final'){
        done=true;const c=d.counts,parts=[];
        if(c.confirmed)parts.push(`${c.confirmed} confirmed`);if(c.contradicted)parts.push(`${c.contradicted} contradicted`);
        if(c.unverified)parts.push(`${c.unverified} unverified`);if(c.not_checkable)parts.push(`${c.not_checkable} not checkable`);
        if(d.claims){head.textContent='';const t=el('span');t.append(el('b',null,'Fact check: '),parts.join(' · '));head.append(t)}
        foot.textContent=`${(d.cost_usd*100).toFixed(1)}¢ · ${Math.round(d.seconds)}s`+(d.downgraded?` · ${d.downgraded} verdict${d.downgraded===1?'':'s'} marked unverified because no real source backed ${d.downgraded===1?'it':'them'}`:'');
        btn.remove();
      }
      else if(kind==='error'){throw new Error(d.message)}
    });
    if(!done)throw new Error('The connection dropped before the check finished.');
  }catch(e){
    head.textContent='';head.append(el('span','fcerr',e.message||"Couldn't run the fact check."));
    btn.disabled=false;btn.textContent='Try the fact check again';
  }
  scrollDown();
}
// ---------- photos and files ----------
// Photos are shrunk on the phone (longest side 1568 px, JPEG), which is all the model uses and keeps uploads small.
// Files stay attached for the rest of the chat, so follow-up questions can use them; the server caches them, so
// asking again about the same file costs much less.
let files=[];
const MAXF=4,MB=1024*1024;
const TEXT_EXT=/\.(txt|md|markdown|csv|tsv|json|xml|html?|log|ya?ml|py|js|ts|jsx|tsx|java|c|cpp|h|cs|go|rb|php|swift|kt|sql|sh|css|ini|toml|srt|vtt)$/i;
function toast(t){const b=$('#toast');b.textContent=t;b.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{b.hidden=true},5000)}
function readAs(file,how){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);how==='text'?r.readAsText(file):r.readAsDataURL(file)})}
async function shrinkImage(file){
  let src;
  try{src=await createImageBitmap(file,{imageOrientation:'from-image'})}
  catch(e){src=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('decode'));i.src=URL.createObjectURL(file)})}
  const w=src.naturalWidth||src.width,h=src.naturalHeight||src.height,sc=Math.min(1,1568/Math.max(w,h));
  const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*sc));c.height=Math.max(1,Math.round(h*sc));
  const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(src,0,0,c.width,c.height);
  const url=c.toDataURL('image/jpeg',0.85);
  return {media_type:'image/jpeg',data:url.split(',')[1],thumb:url};
}
const extOf=n=>((n.match(/\.([a-z0-9]+)$/i)||[])[1]||'file').toUpperCase().slice(0,4);
async function addFiles(list,fromCamera){
  for(const f of list){
    if(files.length>=MAXF){toast(`You can attach up to ${MAXF} files at a time.`);break}
    try{
      let item;
      if(f.type.startsWith('image/')||/\.(heic|heif|jpe?g|png|gif|webp)$/i.test(f.name)){item={kind:'image',...await shrinkImage(f)}}
      else if(f.type==='application/pdf'||/\.pdf$/i.test(f.name)){
        if(f.size>10*MB)throw new Error(`“${f.name}” is over 10 MB.`);
        item={kind:'pdf',media_type:'application/pdf',data:(await readAs(f,'url')).split(',')[1]};
      }
      else if(/\.docx$/i.test(f.name)){
        if(f.size>10*MB)throw new Error(`“${f.name}” is over 10 MB.`);
        item={kind:'docx',media_type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',data:(await readAs(f,'url')).split(',')[1]};
      }
      else if(f.type.startsWith('text/')||f.type==='application/json'||TEXT_EXT.test(f.name)){
        if(f.size>600*1024)throw new Error(`“${f.name}” is too long to read in one go.`);
        item={kind:'text',media_type:'text/plain',data:await readAs(f,'text')};
      }
      else if(/\.(doc|xls|xlsx|ppt|pptx|pages|numbers|key)$/i.test(f.name))throw new Error(`I can't open “${f.name}” directly. Save it as a PDF and attach that instead.`);
      else throw new Error(`I can't read “${f.name}” yet. Photos, PDFs, Word documents (.docx) and text files work.`);
      const name=fromCamera?`Photo ${new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}`:(f.name||'file');
      files.push({id:Math.random().toString(36).slice(2),name,sent:false,...item});
    }catch(e){toast(e.message&&e.message!=='decode'?e.message:`I couldn't open “${f.name||'that file'}”.`)}
  }
  renderTray();
}
function fileIcon(f){if(f.kind==='image'){const i=el('img');i.src=f.thumb;i.alt='';return i}return el('span','ficon',f.kind==='docx'?'DOC':extOf(f.name))}
function renderTray(){
  const tray=$('#tray');tray.textContent='';tray.hidden=!files.length;if(!files.length)return;
  tray.append(el('div','tlabel',files.some(f=>f.sent)?'In this chat. Your questions use these until you remove them.':'Attached. Ask anything about '+(files.length===1?'it':'them')+'.'));
  const list=el('div','tlist');
  files.forEach(f=>{const c=el('div','fchip');c.append(fileIcon(f),el('span','fname',f.name));
    const x=el('button',null,'×');x.type='button';x.setAttribute('aria-label',`Remove ${f.name}`);x.onclick=()=>{files=files.filter(y=>y.id!==f.id);renderTray()};c.append(x);list.append(c)});
  tray.append(list);
}

['f-cam','f-photo','f-file'].forEach(id=>{const inp=$('#'+id);inp.addEventListener('change',()=>{const l=[...inp.files];inp.value='';if(l.length)addFiles(l,id==='f-cam')})});

const payload=()=>files.map(({name,kind,media_type,data})=>({name,kind,media_type,data}));
function defaultQuestion(){const imgs=files.filter(f=>f.kind==='image').length;return imgs===files.length?(imgs===1?'What is in this photo? Tell me anything useful about it.':'What is in these photos? Tell me anything useful about them.'):(files.length===1?'Summarize this file.':'Summarize these files.')}

// ---------- Second opinions: ask other AI models, then compare ----------
let juryOn=false,juryAvail=false,juryNames=[];
fetch('/api/jury').then(r=>r.json()).then(d=>{juryAvail=!!d.enabled;juryOn=juryAvail&&prefs.jury!==false;juryNames=(d.jurors||[]).filter(j=>j.ready).map(j=>j.name)}).catch(()=>{});
const AGREE={strong:['Strong agreement','ok'],partial:['Partly agree','unk'],low:['They disagree','bad']};
function addJury(bot,question,answer){
  const row=actionsFor(bot).querySelector('.arow');
  const b=el('button','fcbtn','⚖️ Second opinions');b.type='button';b.setAttribute('aria-label',`Ask ${juryNames.join(' and ')} the same question and compare`);
  b.onclick=()=>runJury(bot,b,question,answer);row.append(b);

async function runJury(bot,btn,question,answer){
  btn.disabled=true;btn.textContent='Asking…';
  const wrap=actionsFor(bot);wrap.querySelector('.jury')?.remove();
  const panel=el('div','fc jury'),head=el('div','fchead'),cards=el('div','jcards'),cmp=el('div','jcmp'),foot=el('div','fcfoot');
  head.append(el('span','fcspin'),el('span',null,'Asking other AI models…'));panel.append(head,cards,cmp,foot);wrap.append(panel);scrollDown();
  const slot={};
  juryNames.forEach(n=>{const d=el('details','jcard pending');const sm=el('summary');sm.append(el('b',null,n),el('span','jmeta','thinking…'));d.append(sm);cards.append(d);slot[n]=d});
  let done=false;
  try{
    const res=await fetch('/api/jury/stream',{method:'POST',headers:headers(),body:JSON.stringify({question,answer})});
    if(!res.ok||!(res.headers.get('content-type')||'').includes('text/event-stream')){const d=await res.json().catch(()=>({}));throw new Error(d.message||"Couldn't get second opinions.")}
    await readSSE(res,(k,d)=>{
      if(k==='status'){head.lastChild.textContent=d.label+'…'}
      else if(k==='opinion'){const c=slot[d.name];if(!c)return;c.classList.remove('pending');const meta=c.querySelector('.jmeta');
        if(d.error){c.classList.add('failed');meta.textContent=d.error}else{meta.textContent=`${d.model} · ${Math.round(d.seconds)}s`;const t=el('div','jtext');renderAnswer(t,d.text);c.append(t)}}
      else if(k==='final'){done=true;head.textContent='';
        const c=d.comparison;
        if(!c){head.append(el('span',null,'Only one answer came back, so there was nothing to compare.'))}
        else{
          const [word,cls]=AGREE[c.agreement]||AGREE.partial;const badge=el('span','jbadge '+cls,word);head.append(badge);
          if(c.summary)cmp.append(el('p','jsum',c.summary));
          const sec=(title,items,fn)=>{if(!items||!items.length)return;cmp.append(el('div','jh',title));const ul=el('ul','jlist');items.forEach(x=>ul.append(fn(x)));cmp.append(ul)};
          sec('They agree on',c.agree,x=>el('li',null,x));
          sec('Where they differ',c.disagree,x=>{const li=el('li');li.append(el('b',null,x.topic));Object.entries(x.positions||{}).forEach(([m,p])=>{const r=el('div','jpos');r.append(el('span','jwho',m),p);li.append(r)});return li});
          sec('Only one said',c.unique,x=>{const li=el('li');li.append(el('span','jwho',x.model),x.point);return li});
          sec('Worth double-checking',c.check,x=>el('li',null,x));
        }
        foot.textContent=`${d.cost_usd<0.01?'Under 1¢':Math.round(d.cost_usd*100)+'¢'} · ${Math.round(d.seconds)}s · Your question was also sent to ${juryNames.join(' and ')}.`;
        btn.remove();
      }
      else if(k==='error'){throw new Error(d.message)}
    });
    if(!done)throw new Error('The connection dropped. Please try again.');
  }catch(e){head.textContent='';head.append(el('span','fcerr',e.message));btn.disabled=false;btn.textContent='⚖️ Try second opinions again'}
  scrollDown();
}

// ---------- Verified answers ----------
// Every answer arrives signed by the server. "Share verified" sends the signed receipt back, the server checks the
// signature and stores it, and the person gets a link and QR code anyone can use to prove the answer is real.
function addShare(bot,data){
  const row=actionsFor(bot).querySelector('.arow');
  const b=el('button','fcbtn');b.type='button';b.textContent='✓ Share verified';b.setAttribute('aria-label','Share this answer as a verified, tamper-proof link');
  b.onclick=()=>shareVerified(b,data);row.append(b);
}
async function shareVerified(btn,data){
  if(btn.dataset.url){openShareSheet(btn.dataset.id,btn.dataset.url,data);return}
  btn.disabled=true;btn.textContent='Signing…';
  try{
    const res=await fetch('/api/receipts',{method:'POST',headers:headers(),body:JSON.stringify({receipt:data.receipt,signature:data.signature})});
    const d=await res.json().catch(()=>({}));if(!res.ok)throw new Error(d.message||"Couldn't create the link.");
    btn.dataset.id=d.id;btn.dataset.url=d.url;btn.textContent='✓ Verified link ready';btn.classList.add('ok');saveCard(d.id,d.url,data);openShareSheet(d.id,d.url,data);
  }catch(e){btn.textContent='✓ Share verified';toast(e.message)}finally{btn.disabled=false}
}
function wrapLines(ctx,text,maxW,maxLines){
  const out=[];let line='';
  for(const w of text.replace(/\s+/g,' ').split(' ')){const t=line?line+' '+w:w;if(ctx.measureText(t).width>maxW&&line){out.push(line);line=w;if(out.length===maxLines)break}else line=t}
  if(out.length<maxLines&&line)out.push(line);
  if(out.length===maxLines&&ctx.measureText(out[maxLines-1]+' …').width<=maxW&&text.length>out.join(' ').length)out[maxLines-1]+=' …';
  return out;
}
async function cardImage(id,url,r){
  const W=1080,H=1350,c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
  await document.fonts?.ready;
  g.fillStyle='#0b0b0b';g.fillRect(0,0,W,H);g.fillStyle='#e50914';g.fillRect(0,0,W,120);
  g.fillStyle='#fff';g.font='700 34px "Instrument Sans", system-ui, sans-serif';g.fillText('✓  ASK HARSHA · VERIFIED ANSWER',60,74);
  g.fillStyle='#a3a3a3';g.font='500 32px "Instrument Sans", system-ui, sans-serif';
  let y=200;wrapLines(g,'Q: '+r.question,W-120,3).forEach(l=>{g.fillText(l,60,y);y+=46});
  y+=30;g.fillStyle='#f5f5f1';g.font='500 40px "Instrument Sans", system-ui, sans-serif';
  wrapLines(g,r.answer.replace(/\[(F\d{2,3}|N\d{3,4})\]/g,'[$1]'),W-120,14).forEach(l=>{g.fillText(l,60,y);y+=56});
  g.fillStyle='#232323';g.fillRect(0,H-330,W,330);
  const img=new Image();img.src=`/api/receipts/${id}/qr.svg`;await img.decode().catch(()=>{});
  g.fillStyle='#fff';g.fillRect(60,H-290,250,250);try{g.drawImage(img,70,H-280,230,230)}catch(e){}
  g.fillStyle='#f5f5f1';g.font='700 44px "Instrument Sans", system-ui, sans-serif';g.fillText('Scan to verify',350,H-200);
  g.fillStyle='#a3a3a3';g.font='500 30px "Instrument Sans", system-ui, sans-serif';
  wrapLines(g,'Digitally signed by Ask Harsha. Any edit breaks the signature.',W-410,2).forEach((l,i)=>g.fillText(l,350,H-150+i*40));
  g.fillText(url.replace(/^https?:\/\//,''),350,H-60);
  return new Promise(res=>c.toBlob(res,'image/png'));
}

// ---------- Ask the real Harsha ----------
// When the agent says a human would answer better, a card pops up under the answer. Sending is the visitor's choice.
// They get a private link; this browser also remembers it and shows Harsha's reply when it arrives.
const TKEY='askh_tickets';
const tickets={get(){try{return JSON.parse(localStorage.getItem(TKEY)||'[]')||[]}catch(e){return[]}},set(v){try{localStorage.setItem(TKEY,JSON.stringify(v.slice(-20)))}catch(e){}}};
let inboxCount=0;
const ticketLink=id=>`${location.origin}/?ask=${encodeURIComponent(id)}`;
function addAskHarsha(bot,question,data){
  const card=el('div','askh');card.setAttribute('role','region');card.setAttribute('aria-label','Ask the real Harsha');
  const top=el('div','ah-top'),av=el('div','ah-av','H'),tx=el('div');
  tx.append(el('b',null,'Ask the real Harsha?'),el('span','ah-why',data.ask_harsha.reason));top.append(av,tx);
  const r=el('div','row'),go=el('button','btn red','Ask Harsha'),no=el('button','btn','No thanks');go.type=no.type='button';
  no.onclick=()=>card.remove();go.onclick=()=>openAskSheet(card,question,data);

}
function openAskSheet(card,question,data){
  sheet((s,close)=>{
    s.append(el('h3',null,'Ask the real Harsha'),el('small',null,"Harsha reads these himself and answers when he can. You'll get a private link to see his answer."));
    const qa=el('textarea','field');qa.rows=3;qa.maxLength=1000;qa.value=question;qa.setAttribute('aria-label','Your question');
    const na=el('textarea','field');na.rows=2;na.maxLength=500;na.placeholder='Anything Harsha should know? (optional)';na.setAttribute('aria-label','Note for Harsha');
    const line=el('p','msgline'),r=el('div','row'),c=el('button','btn','Cancel'),go=el('button','btn red','Send to Harsha');c.type=go.type='button';
    s.append(qa,na,el('small',null,"Only Harsha can read this. Please don't include passwords, account numbers or other private details."),line,r);r.append(c,go);
    c.onclick=close;
    go.onclick=async()=>{
      const qv=qa.value.trim();if(!qv){line.textContent='Write your question first.';return}
      go.disabled=true;line.textContent='';
      try{
        const res=await fetch('/api/inbox',{method:'POST',headers:headers(),body:JSON.stringify({question:qv,note:na.value.trim(),reason:data.ask_harsha.reason,kind:data.ask_harsha.kind,context:(data.answer||'').slice(0,1200)})});
        const d=await res.json().catch(()=>({}));
        if(!res.ok)throw new Error(d.message||"It didn't send. Please try again.");
        const t=tickets.get();t.push({id:d.id,q:qv,seen:false});tickets.set(t);
        close();card.textContent='';
        const done=el('div','done');done.append(el('b',null,'Sent to Harsha.'),` Come back to this page, or keep this link to see his answer: `);
        const a=el('a',null,ticketLink(d.id));a.href=ticketLink(d.id);done.append(a);
        const cp=el('button','btn','Copy link');cp.type='button';cp.onclick=async()=>{try{await navigator.clipboard.writeText(ticketLink(d.id));cp.textContent='Copied'}catch(e){cp.textContent='Long-press the link to copy'}};
        const rr=el('div','row');rr.append(cp);card.append(done,rr);
      }catch(e){line.textContent=e.message}finally{go.disabled=false}
    };
    setTimeout(()=>qa.focus(),50);
  });
}
function showAnswered(t,item){
  const box=el('div','msg bot answered');box.setAttribute('role','status');
  box.append(el('div','ah-label','The real Harsha answered'),el('div','ah-q',`You asked: “${item.question}”`),el('div',null,item.answer));
  const x=el('button','ah-x','Dismiss');x.type='button';x.onclick=()=>box.remove();box.append(x);
  hello.before(box);
}
async function checkTickets(){
  const url=new URL(location.href),fromLink=url.searchParams.get('ask');
  let list=tickets.get();
  if(fromLink&&!list.some(t=>t.id===fromLink)){list.push({id:fromLink,q:'',seen:false});tickets.set(list)}
  if(fromLink){url.searchParams.delete('ask');window.history.replaceState(null,'',url.pathname+url.search)}
  for(const t of list.filter(t=>!t.seen||t.id===fromLink).slice(-10)){
    try{
      const res=await fetch('/api/inbox/'+encodeURIComponent(t.id));
      if(res.status===404){list=list.filter(x=>x.id!==t.id);continue}
      const d=await res.json();if(!res.ok)continue;
      if(d.status==='answered'){showAnswered(t,d);t.seen=true}
      else if(t.id===fromLink){const w=el('div','msg bot answered');w.append(el('div','ah-label','Waiting for Harsha'),el('div','ah-q',`You asked: “${d.question}”`),el('div',null,"He hasn't answered yet. This page will show his answer when he does."));hello.before(w)}
    }catch(e){}
  }
  tickets.set(list);
}
async function refreshInboxCount(){
  if(!passcode)return;
  try{const res=await fetch('/api/owner/inbox',{headers:{'X-Owner-Passcode':passcode}});if(!res.ok)return;const d=await res.json();
    inboxCount=d.open.length;const sub=$('#sub');sub.textContent='● Owner mode'+(inboxCount?` · ${inboxCount} question${inboxCount===1?'':'s'} for you`:'');
    sub.style.cursor=inboxCount?'pointer':'';sub.onclick=inboxCount?openInbox:null;
  }catch(e){}
}
function openInbox(){
  sheet(async (s,close)=>{
    s.append(el('h3',null,'Inbox'),el('small',null,'Questions visitors chose to send you. Your answer appears at their private link.'));
    const list=el('div','inbox');s.append(list);
    const r=el('div','row'),b=el('button','btn','Close');b.type='button';b.onclick=close;r.append(b);s.append(r);
    list.append(el('p','evhead','Loading…'));
    let d;
    try{const res=await fetch('/api/owner/inbox',{headers:headers()});d=await res.json();if(!res.ok)throw new Error(d.message)}
    catch(e){list.textContent='';list.append(el('p','msgline',e.message||"Couldn't load the inbox."));return}

      if(it.note){const n=el('div','meta');n.append(el('b',null,'Their note: '),it.note);c.append(n)}
      if(it.context){const dt=el('details');dt.append(el('summary',null,'What the agent told them'),el('p',null,it.context));c.append(dt)}
      const ta=el('textarea');ta.placeholder='Your answer';ta.setAttribute('aria-label','Your answer');
      const lb=el('label'),cb=el('input');cb.type='checkbox';cb.checked=it.kind==='about_harsha';lb.append(cb,'Also teach the agent (saves to memory, visible to visitors)');
      const line=el('p','msgline'),rr=el('div','row'),dis=el('button','btn','Dismiss'),send=el('button','btn red','Send answer');dis.type=send.type='button';
      dis.onclick=async()=>{dis.disabled=true;try{const res=await fetch(`/api/owner/inbox/${it.id}/dismiss`,{method:'POST',headers:headers()});if(res.ok){c.remove();refreshInboxCount()}else line.textContent=(await res.json()).message}catch(e){line.textContent="Couldn't connect."}finally{dis.disabled=false}};
      send.onclick=async()=>{const a=ta.value.trim();if(!a){line.textContent='Write an answer first.';return}send.disabled=true;line.textContent='';
        try{const res=await fetch(`/api/owner/inbox/${it.id}/answer`,{method:'POST',headers:headers(),body:JSON.stringify({answer:a,remember:cb.checked})});const x=await res.json().catch(()=>({}));
          if(!res.ok)throw new Error(x.message||"It didn't send.");
          c.textContent='';c.append(el('div','q',it.question),el('div','ans',a),el('div','meta',x.note_id?`Answered and saved to memory as ${x.note_id}.`:'Answered.'));refreshInboxCount();
        }catch(e){line.textContent=e.message}finally{send.disabled=false}};
      rr.append(dis,send);c.append(ta,lb,line,rr);list.append(c);
    });
    if(d.answered.length){const dt=el('details','how');dt.append(el('summary',null,`Answered (${d.answered.length})`));
      d.answered.forEach(it=>{const c=el('div','ibx');c.append(el('div','q',it.question),el('div','ans',it.answer));dt.append(c)});list.append(dt)}
  });
}

async function askOnce(bot,text){  // fallback when streaming isn't available
  const res=await fetch('/api/chat',{method:'POST',headers:headers(),body:JSON.stringify({question:text,history,attachments:payload(),prefs:chatPrefs(),project:(cur&&cur.project)||nextProject||''})});
  const data=await res.json().catch(()=>({}));
  if(!res.ok){bot.classList.add('err');bot.textContent=data.message||'Something went wrong. Please try again.';return}
  showFinal(bot,data,text);
}
async function ask(text){
  text=text.trim();if(busy)return;if(!text&&files.length)text=defaultQuestion();if(!text)return;
  busy=true;send.disabled=true;hello.hidden=true;resetBtn.hidden=false;
  const ub=bubble('user'),fresh=files.filter(f=>!f.sent);
  if(fresh.length){const fl=el('div','ufiles');fresh.forEach(f=>fl.append(f.kind==='image'?fileIcon(f):el('span','ficon',f.name)));ub.append(fl,el('div','utext',text))}
  else ub.textContent=text;
  pendingNames=fresh.map(f=>f.name);
  const bot=bubble('bot');
  const status=el('div','status');status.innerHTML='<span class="typing"><span></span><span></span><span></span></span>';const stxt=el('span',null,'Thinking');status.append(stxt);
  const live=el('div','body');bot.append(status,live);
  let streamed='',finished=false;
  try{
    const res=await fetch('/api/chat/stream',{method:'POST',headers:headers(),body:JSON.stringify({question:text,history,attachments:payload(),prefs:chatPrefs(),project:(cur&&cur.project)||nextProject||''})});
    const type=res.headers.get('content-type')||'';
    if(!res.ok||!type.includes('text/event-stream')){
      const data=await res.json().catch(()=>({}));
      if(res.status===404||res.status===405){await askOnce(bot,text);return}
      bot.classList.add('err');bot.textContent=data.message||'Something went wrong. Please try again.';return;
    }
    if(!res.body){await askOnce(bot,text);return}
    await readSSE(res,(kind,d)=>{
      if(kind==='status'){stxt.textContent=d.label+'…';status.hidden=false}
      else if(kind==='text'){streamed+=d.delta;status.hidden=true;renderAnswer(live,streamed);scrollDown()}
      else if(kind==='text_reset'){streamed='';live.textContent='';status.hidden=false}
      else if(kind==='final'){finished=true;showFinal(bot,d,text)}
      else if(kind==='error'){finished=true;bot.classList.add('err');bot.textContent=d.message||'Something went wrong. Please try again.'}
    });
    if(!finished){bot.classList.add('err');status.remove();if(!streamed)bot.textContent="The connection dropped before the answer finished. Please try again.";else bot.append(el('div','verdict warn','Connection dropped; this answer may be incomplete.'))}
  }catch(e){
    if(!finished){bot.classList.add('err');bot.textContent="Couldn't connect. Check your connection and try again."}
  }finally{busy=false;send.disabled=false;scrollDown()}
}

// ---------- speak instead of typing ----------
// The phone turns speech into text (Web Speech API); words appear in the box live and you review before sending.
// iPhone stops listening at every pause, so a fresh recognizer restarts until you tap stop or go quiet for a few seconds.
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const micBtn=$('#mic');let dict=null;
function stopDictation(){if(dict){dict.on=false;try{dict.rec&&dict.rec.stop()}catch(e){}}}
function startDictation(){
  if(!SR){toast("Voice typing isn't available in this browser. Tap the box and use the microphone on your keyboard.");q.focus();return}
  const base=q.value.trim(),d={on:true,rec:null,finals:[],interim:'',heard:false,quiet:null,ph:q.placeholder};dict=d;
  micBtn.classList.add('on');micBtn.setAttribute('aria-pressed','true');micBtn.setAttribute('aria-label','Stop listening');
  q.classList.add('listening');q.placeholder='Listening… speak now';
  const show=()=>{q.value=[base,...d.finals,d.interim].filter(Boolean).join(' ').replace(/\s+/g,' ').trimStart();grow()};
  const settle=()=>{clearTimeout(d.quiet);d.quiet=setTimeout(()=>{if(d.heard)stopDictation()},IOS?3500:2500)};  // stop after a pause once you've said something
  const loop=()=>{
    if(!d.on)return done();
    const r=new SR();d.rec=r;r.lang=navigator.language||'en-US';r.interimResults=true;r.continuous=!IOS;
    r.onresult=e=>{d.interim='';for(let i=e.resultIndex;i<e.results.length;i++){const x=e.results[i];if(x.isFinal){const t=x[0].transcript.trim();if(t)d.finals.push(t)}else d.interim+=x[0].transcript}
      d.heard=true;show();settle()};
    r.onerror=e=>{const m={'not-allowed':'Microphone access is blocked. Allow it for this site in your browser settings.','service-not-allowed':IOS?'Turn on Dictation (Settings → General → Keyboard → Enable Dictation), then try again.':'Voice typing is blocked in this browser.','audio-capture':"I couldn't use the microphone.",'network':'Voice typing needs an internet connection.'}[e.error];
      if(m){d.on=false;toast(m)}};
    r.onend=()=>{d.rec=null;if(d.interim.trim()){d.finals.push(d.interim.trim());d.interim=''}show();if(d.on)setTimeout(loop,200);else done()};
    try{r.start()}catch(e){d.on=false;done()}
  };
  const done=()=>{if(dict!==d)return;dict=null;clearTimeout(d.quiet);micBtn.classList.remove('on');micBtn.setAttribute('aria-pressed','false');micBtn.setAttribute('aria-label','Speak your message');
    q.classList.remove('listening');q.placeholder=d.ph;show();if(!d.heard)toast("I didn't hear anything. Tap the mic and try again.");else{q.focus();const n=q.value.length;try{q.setSelectionRange(n,n)}catch(e){}}};
  d.quiet=setTimeout(()=>{if(!d.heard)stopDictation()},8000);  // nothing said at all: give up after 8 seconds
  loop();
}
micBtn.addEventListener('click',()=>{if(dict)stopDictation();else startDictation()});

})();
