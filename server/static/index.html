<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ask Harsha</title>
<meta name="description" content="An AI assistant built from scratch by Harsha Reddy. Ask about anything, including his product management experience, which it answers with cited sources.">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ask Harsha">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<link rel="icon" href="/static/icon-192.png">
<link rel="manifest" href="/static/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Instrument+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: one column, phone first. Fixed header, scrolling conversation, input bar pinned to the bottom above the home indicator. */
:root{
  --bg:#0b0b0b; --panel:#171717; --raise:#232323; --line:#2e2e2e;
  --fg:#f5f5f1; --muted:#a3a3a3; --red:#e50914; --red-hot:#ff2a36; --good:#46d369; --warn:#f2b445; --blue:#7cb7ff;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,textarea:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--fg);outline-offset:2px}

header{flex:0 0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) var(--gr) 12px var(--gl);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;background:var(--bg)}
header{align-items:flex-start}
header>.hbtn{margin-top:3px}
.brandcol{display:flex;flex-direction:column;align-items:flex-start;gap:8px;flex:0 0 40px;width:40px}
.brandcol .chats-btn{white-space:nowrap}
.brandcol .chats-btn{font-size:12px;padding:5px 9px 5px 7px;gap:5px;background:var(--panel)}
.brandcol .chats-btn svg{width:15px;height:15px}
.mark{width:40px;height:40px;border-radius:8px;background:var(--red);display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:26px;line-height:1;flex:0 0 auto}
.who{min-width:0;flex:1}
.who h1{margin:0;font-size:17px;font-weight:700;line-height:1.2;display:flex;align-items:center;gap:8px;white-space:nowrap}
.who p{margin:0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who p.owner{color:var(--good);font-weight:600}
.pill{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--bg);background:var(--good);border-radius:999px;padding:2px 7px}
.hbtn{font-size:13px;color:var(--muted);padding:8px 2px;display:flex;align-items:center;gap:4px;white-space:nowrap}
@media (max-width:420px){header{gap:10px}.mark{width:36px;height:36px;font-size:23px}}
.hbtn:hover{color:var(--fg)}
a.hbtn{text-decoration:none}
.chats-btn{border:1px solid var(--line);border-radius:999px;padding:6px 11px 6px 8px;color:var(--fg);font-weight:600}
.chats-btn:hover{border-color:var(--muted)}
.chats-btn svg{width:17px;height:17px}
.chats-btn.nudge{animation:nudge 1.6s ease 2}
@keyframes nudge{30%{box-shadow:0 0 0 6px color-mix(in srgb,var(--red) 35%,transparent);border-color:var(--red)}}
/* home: continue where you left off */
.cont{display:grid;gap:8px;margin-top:10px}
.cont-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.cont-h b{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.cont-h button{font-size:13px;color:var(--fg);font-weight:600;padding:4px 0}
.cont-h button:hover{color:var(--red-hot)}
.cont-row{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1*var(--gr)) 0 calc(-1*var(--gl));padding:2px var(--gr) 6px var(--gl);scroll-snap-type:x proximity;scroll-padding-inline:var(--gl) var(--gr)}
.cont-row::-webkit-scrollbar{display:none}
.cc{flex:0 0 min(230px,64vw);scroll-snap-align:start;text-align:left;display:grid;gap:6px;align-content:start;padding:12px 14px 0;border-radius:14px;background:var(--panel);border:1px solid var(--line);overflow:hidden;min-height:118px}
.cc:hover{border-color:var(--muted)}
.cc .cc-top{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.cc b{font-size:15px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cc span.cc-sub{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cc .cc-bar{align-self:end;height:3px;margin:4px -14px 0;background:var(--raise)}
.cc .cc-bar i{display:block;height:100%;background:var(--red)}
.cc.all{flex-basis:120px;place-items:center;align-content:center;text-align:center;font-weight:600;font-size:14px;background:transparent;border-style:dashed;padding-bottom:12px}
.assist-card{display:grid;gap:2px;margin-top:6px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);border-left:3px solid var(--red);background:var(--panel);color:var(--fg);text-decoration:none}
.assist-card b{font-size:15px}
.assist-card span{font-size:13.5px;color:var(--muted)}
.assist-card:hover{border-color:var(--muted);border-left-color:var(--red)}
.hbtn svg{width:18px;height:18px}

main{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.thread{max-width:720px;margin:0 auto;padding:20px var(--gr) 24px var(--gl);display:flex;flex-direction:column;gap:14px}
.hello{display:grid;gap:10px;padding:8px 0 4px}
.hello h2{margin:0;font-family:var(--f-display);font-weight:900;text-transform:uppercase;font-size:clamp(40px,11vw,64px);line-height:.88;letter-spacing:.005em}
.hello h2 span{color:var(--red)}
.hello p{margin:0;color:var(--muted);max-width:48ch}
.hello .wx{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--fg);font-weight:600;animation:pop .3s ease}
.hello .wx .wi{font-size:22px;line-height:1}
.hello .wx small{color:var(--muted);font-weight:500;font-size:13px}
.hello .owner-tip{font-size:12.5px}
/* embed: inside a website's chat pop-up, the pop-up has its own title bar */
html.embed header{display:none}
html.embed .hello h2{font-size:clamp(34px,10vw,48px)}
html.embed .fine{display:none}
.chip.link{text-decoration:none;color:var(--fg);border-color:color-mix(in srgb,var(--red) 55%,var(--line))}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding-top:4px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-size:14px;text-align:left}
.chip:hover{border-color:var(--muted)}
.msg{max-width:88%;border-radius:18px;padding:11px 15px;white-space:pre-wrap;overflow-wrap:anywhere;animation:pop .2s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.user{align-self:flex-end;background:var(--raise);border-bottom-right-radius:6px}
.msg.bot{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.err{border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.cite{display:inline-block;vertical-align:1px;font-size:11px;font-weight:700;letter-spacing:.02em;line-height:1;color:var(--red-hot);border:1px solid color-mix(in srgb,var(--red) 60%,transparent);border-radius:5px;padding:3px 5px;margin:0 1px}
.cite.note{color:var(--blue);border-color:color-mix(in srgb,var(--blue) 55%,transparent)}
.cite:hover{background:color-mix(in srgb,var(--red) 18%,transparent)}
.extras{display:grid;gap:8px;margin-top:10px;white-space:normal}
.verdict{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.verdict i{width:7px;height:7px;border-radius:50%;background:var(--good);flex:0 0 auto}
.verdict.warn i{background:var(--warn)}
.verdict.plain i{background:var(--muted)}
.sources{display:flex;flex-wrap:wrap;gap:6px}
.src{font-size:12px;color:var(--fg);background:var(--raise);border:1px solid var(--line);border-radius:999px;padding:4px 10px;text-decoration:none;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src:hover{border-color:var(--muted)}
.saved{font-size:12.5px;color:var(--blue);border-left:2px solid var(--blue);padding-left:8px}
.how{font-size:13px;color:var(--muted)}
.fcwrap{display:grid;gap:8px;margin-top:10px;white-space:normal}
.arow{display:flex;gap:8px;flex-wrap:wrap}
.vcard{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--bg)}
.vcard .vtop{background:var(--red);padding:10px 14px;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.vcard .vtop i{width:20px;height:20px;border-radius:50%;background:#fff;color:var(--red);display:grid;place-items:center;font-style:normal;font-size:12px}
.vcard .vbody{padding:12px 14px;display:grid;gap:8px}
.vcard .vq{font-size:13px;color:var(--muted)}
.vcard .va{font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.vcard .vfoot{display:flex;gap:12px;align-items:center;border-top:1px solid var(--line);padding:10px 14px}
.vcard .vfoot img{width:84px;height:84px;background:#fff;border-radius:8px;padding:4px;flex:0 0 auto}
.vcard .vfoot b{display:block;font-size:14px}
.vcard .vfoot span{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.jcards{display:grid;gap:6px}
.jcard{border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.jcard summary{display:flex;gap:10px;align-items:baseline;cursor:pointer;list-style:none;font-size:14px}
.jcard summary::-webkit-details-marker{display:none}
.jcard summary::after{content:"Show";margin-left:auto;font-size:12px;color:var(--muted)}
.jcard[open] summary::after{content:"Hide"}
.jcard.pending summary::after,.jcard.failed summary::after{content:""}
.jcard .jmeta{font-size:12px;color:var(--muted)}
.jcard.pending .jmeta{animation:pulse 1.2s infinite}
.jcard.failed .jmeta{color:var(--warn)}
.jcard .jtext{font-size:14px;margin-top:8px;white-space:pre-wrap;color:var(--fg)}
.jbadge{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 10px}
.jbadge.ok{color:var(--good);background:color-mix(in srgb,var(--good) 16%,transparent)}
.jbadge.unk{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.jbadge.bad{color:var(--red-hot);background:color-mix(in srgb,var(--red) 18%,transparent)}
.jcmp{display:grid;gap:6px}
.jsum{margin:0;font-size:14px}
.jh{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.jlist{margin:0;padding-left:18px;display:grid;gap:6px;font-size:14px}
.jlist b{display:block;font-weight:600}
.jpos{font-size:13.5px;color:var(--muted);margin-top:2px}
.jwho{display:inline-block;font-size:11px;font-weight:700;color:var(--fg);background:var(--raise);border-radius:5px;padding:1px 6px;margin-right:6px}
.fcbtn.ok{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.fcbtn{justify-self:start;font-size:12.5px;font-weight:600;color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--raise)}
.fcbtn:hover{border-color:var(--muted)}
.fcbtn:disabled{opacity:.6}
.fc{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:8px;background:var(--bg)}
.fchead{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.fchead b{color:var(--fg)}
.fcspin{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--fg);animation:spin .8s linear infinite;flex:0 0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.fcerr{color:var(--warn)}
.fclist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.fcrow{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:start}
.fcmark{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--raise);color:var(--muted)}
.fcrow.pending .fcmark{animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.35}}
.fcrow.ok .fcmark{background:color-mix(in srgb,var(--good) 22%,transparent);color:var(--good)}
.fcrow.bad .fcmark{background:color-mix(in srgb,var(--red-hot) 22%,transparent);color:var(--red-hot)}
.fcrow.unk .fcmark{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn)}
.fcbody{display:grid;gap:4px;min-width:0}
.fcclaim{font-size:14px;color:var(--fg)}
.fcwhy{font-size:13px;color:var(--muted)}
.fcwhy b{color:var(--fg);font-weight:600}
.fcrow.ok .fcwhy b{color:var(--good)}.fcrow.bad .fcwhy b{color:var(--red-hot)}.fcrow.unk .fcwhy b{color:var(--warn)}
.fcfoot{font-size:12px;color:var(--muted)}
.askh{margin-top:12px;border-radius:14px;padding:12px 14px;background:linear-gradient(135deg,color-mix(in srgb,var(--red) 20%,var(--panel)),var(--panel));border:1px solid color-mix(in srgb,var(--red) 55%,var(--line));display:grid;gap:8px;white-space:normal;animation:askpop .35s cubic-bezier(.2,.9,.3,1.3)}
@keyframes askpop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.askh .ah-top{display:flex;gap:10px;align-items:center}
.askh .ah-av{width:34px;height:34px;border-radius:50%;background:var(--red);display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:20px;flex:0 0 auto}
.askh b{font-size:15px;display:block}
.askh .ah-why{font-size:13px;color:var(--muted)}
.askh .row{justify-content:flex-start}
.askh .done{font-size:13.5px;color:var(--fg)}
.askh .done a{color:var(--fg)}
.answered{border:1px solid color-mix(in srgb,var(--good) 50%,var(--line));background:color-mix(in srgb,var(--good) 8%,var(--panel));border-radius:16px;padding:12px 14px;display:grid;gap:6px;white-space:pre-wrap}
.answered .ah-label{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--good);white-space:normal}
.answered .ah-q{font-size:13.5px;color:var(--muted);white-space:normal}
.answered .ah-x{justify-self:end;font-size:12.5px;color:var(--muted);padding:4px 0}
.inbox{display:grid;gap:10px}
.ibx{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px}
.ibx .q{font-size:15.5px}
.ibx .meta{font-size:12px;color:var(--muted)}
.ibx details{font-size:13px;color:var(--muted)}
.ibx details summary{cursor:pointer;color:var(--fg);font-weight:600;font-size:12.5px}
.ibx textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;color:var(--fg);font:inherit;font-size:15px;padding:10px 12px;resize:vertical;min-height:70px}
.ibx label{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--muted)}
.ibx .ans{font-size:14px;border-left:2px solid var(--good);padding-left:8px}
.how .direct{margin:6px 0 2px;font-size:13px;color:var(--muted)}
.status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
.tools{display:grid;gap:8px}
.tool{display:grid;gap:2px;text-align:left;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--bg)}
.tool:hover{border-color:var(--muted)}
.tool b{font-size:15px}
.tool span{font-size:13px;color:var(--muted)}
.evhead{font-size:14px;color:var(--muted)}
.evhead b{color:var(--fg)}
.evbar{height:4px;border-radius:2px;background:var(--raise);overflow:hidden}
.evbar i{display:block;height:100%;width:0;background:var(--red);transition:width .3s}
.evlist{display:grid;gap:6px}
.evrow{border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.evrow summary{display:flex;gap:10px;align-items:baseline;cursor:pointer;list-style:none}
.evrow summary::-webkit-details-marker{display:none}
.evrow .evmark{font-size:11px;font-weight:700;letter-spacing:.06em;flex:0 0 auto}
.evrow.pass .evmark{color:var(--good)}
.evrow.fail .evmark{color:var(--warn)}
.evrow .q{font-size:14px}
.evrow .why{color:var(--warn);font-size:13px;margin:6px 0 0}
.evrow .ans{white-space:pre-wrap;font-size:13px;color:var(--muted);margin:6px 0 0;max-height:220px;overflow:auto}
.evrow .meta{font-size:12px;color:var(--muted);margin:4px 0 0}
.how summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:6px;padding:4px 0;color:var(--fg);font-weight:600;font-size:12.5px}
.how summary::-webkit-details-marker{display:none}
.how summary::before{content:"";width:6px;height:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s;margin-right:2px}
.how[open] summary::before{transform:rotate(45deg)}
.steps{margin:6px 0 2px;padding-left:20px;display:grid;gap:8px}
.steps li{padding-left:2px}
.steps li::marker{color:var(--muted);font-size:12px}
.steps .sk{color:var(--fg);font-weight:500;margin-right:6px}
.steps .sq{color:var(--muted);margin-right:6px;overflow-wrap:anywhere}
.steps .sf{display:inline-flex;flex-wrap:wrap;gap:4px;vertical-align:middle}
.steps .sn{color:var(--muted);font-style:italic}
.steps .se{color:var(--warn)}
.typing{display:inline-flex;gap:4px;align-items:center;color:var(--muted);font-size:14px}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:dot 1.2s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.25}40%{opacity:1}}

footer{flex:0 0 auto;border-top:1px solid var(--line);background:var(--bg);padding:10px var(--gr) calc(10px + env(safe-area-inset-bottom,0px)) var(--gl)}
form.ask{max-width:720px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;min-width:0;resize:none;background:var(--panel);border:1px solid var(--line);border-radius:22px;color:var(--fg);font:inherit;font-size:16px;line-height:1.4;padding:11px 16px;max-height:120px}
textarea:focus{outline:none;border-color:var(--muted)}
.mic{width:44px;height:44px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;flex:0 0 auto;color:var(--fg)}
.mic:hover{border-color:var(--muted)}
.mic svg{width:20px;height:20px}
.mic.on{background:var(--fg);color:var(--bg);border-color:var(--fg);animation:micpulse 1.4s ease-in-out infinite}
@keyframes micpulse{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--fg) 18%,transparent)}}
textarea.listening{border-color:var(--fg)}
.send{width:44px;height:44px;border-radius:50%;background:var(--red);display:grid;place-items:center;flex:0 0 auto;transition:background-color .15s}
.send:hover{background:var(--red-hot)}
.send:disabled{opacity:.4;cursor:default}
.send svg{width:20px;height:20px}
.attach{width:44px;height:44px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;flex:0 0 auto;color:var(--fg)}
.attach:hover{border-color:var(--muted)}
.attach svg{width:20px;height:20px}
.tray{max-width:720px;margin:0 auto 8px;display:grid;gap:6px}
.tray .tlabel{font-size:12px;color:var(--muted)}
.tray .tlist{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tray .tlist::-webkit-scrollbar{display:none}
.fchip{flex:0 0 auto;display:flex;align-items:center;gap:8px;max-width:220px;padding:4px 4px 4px 4px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.fchip img,.fchip .ficon{width:40px;height:40px;border-radius:8px;object-fit:cover;flex:0 0 auto}
.fchip .ficon{display:grid;place-items:center;background:var(--raise);font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--red-hot)}
.fchip .fname{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.fchip button{width:32px;height:32px;flex:0 0 auto;border-radius:50%;color:var(--muted);font-size:18px;line-height:1}
.fchip button:hover{color:var(--fg);background:var(--raise)}
.toast{max-width:720px;margin:0 auto 8px;font-size:13px;color:var(--warn)}
.msg.user .ufiles{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;justify-content:flex-end}
.msg.user .ufiles img{width:72px;height:72px;border-radius:10px;object-fit:cover;display:block}
.msg.user .ufiles .ficon{display:grid;place-items:center;min-width:72px;height:40px;padding:0 10px;border-radius:10px;background:var(--panel);font-size:12px;font-weight:600;color:var(--fg)}
.msg.user:has(.ufiles){background:transparent;padding-right:0}
.msg.user .utext{background:var(--raise);border-radius:18px;border-bottom-right-radius:6px;padding:11px 15px;display:inline-block}
.msg.user:has(.ufiles) .utext{float:right}
.fine{max-width:720px;margin:8px auto 0;font-size:11.5px;color:var(--muted);text-align:center}

.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:min(560px,100%);max-height:85vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:18px var(--gr) calc(22px + env(safe-area-inset-bottom,0px)) var(--gl);display:grid;gap:12px;animation:up .2s ease}
@keyframes up{from{transform:translateY(30px)}to{transform:none}}
.ep-bg{position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.55);animation:fade .2s ease}
.ep-bg.out{animation:fadeout .22s ease forwards}
@keyframes fadeout{to{opacity:0}}
.ep-drawer{position:absolute;top:0;bottom:0;left:0;width:min(420px,92vw);background:var(--bg);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:contain;padding:calc(12px + env(safe-area-inset-top,0px)) 0 calc(16px + env(safe-area-inset-bottom,0px)) env(safe-area-inset-left,0px);animation:slidein .28s cubic-bezier(.2,.8,.2,1)}
.ep-drawer.out{animation:slideout .22s ease forwards}
.ep-drawer>*{flex-shrink:0}
@keyframes slidein{from{transform:translateX(-100%)}to{transform:none}}
@keyframes slideout{to{transform:translateX(-100%)}}
.ep-top{display:flex;align-items:center;justify-content:space-between;padding:0 12px 10px 16px}
.ep-brand{display:flex;align-items:center;gap:10px}
.ep-h{width:30px;height:30px;border-radius:6px;background:var(--red);display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:20px}
.ep-brand b{font-size:17px;display:block;line-height:1.2}
.ep-brand small{font-size:12px;color:var(--muted)}
.ep-x{width:40px;height:40px;border-radius:10px;font-size:22px;color:var(--muted)}
.ep-x:hover{color:var(--fg);background:var(--raise)}
.ep-reel{position:relative;margin:0 12px;border-radius:16px;padding:16px 16px 12px;background:radial-gradient(120% 90% at 0% 0%,color-mix(in srgb,var(--red) 38%,transparent),transparent 60%),linear-gradient(160deg,#1c0507,#0b0b0b 70%);border:1px solid color-mix(in srgb,var(--red) 35%,var(--line));overflow:hidden;display:grid;gap:4px;min-height:208px;align-content:start}
.ep-reel::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px)}
.ep-prev{font-size:11px;font-weight:700;letter-spacing:.32em;text-transform:uppercase;color:var(--muted)}
.ep-show{font-family:var(--f-display);font-weight:900;font-size:34px;line-height:.9;text-transform:uppercase;color:var(--red-hot);letter-spacing:.01em}
.ep-stage{display:grid;gap:8px;text-align:left;min-height:112px;align-content:center;padding:6px 0 6px;margin-top:10px}
.ep-line{font-size:17px;line-height:1.32;font-weight:600;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;quotes:"\201C" "\201D";animation:lineIn .5s ease both}
.ep-from{font-size:12.5px;color:var(--muted);animation:lineIn .5s .15s ease both}
@keyframes lineIn{from{opacity:0;transform:translateY(10px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
.ep-ctrl{display:flex;align-items:center;gap:10px}
.ep-segs{flex:1;display:flex;gap:4px}
.ep-segs span{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.18);overflow:hidden}
.ep-segs span i{display:block;height:100%;width:0;background:var(--fg)}
.ep-segs span.done i{width:100%}
.ep-segs span.on i{animation:segfill 2.1s linear forwards}
@keyframes segfill{to{width:100%}}
.ep-skip{font-size:12.5px;font-weight:600;color:var(--fg);padding:6px 8px;border-radius:8px;white-space:nowrap}
.ep-skip:hover{background:rgba(255,255,255,.08)}
.ep-reel.empty{min-height:0}
.ep-note{color:var(--muted);font-size:14px;margin:6px 0 0}
.ep-tools{display:flex;gap:8px;padding:14px 12px 6px}
.ep-new{flex:0 0 auto;background:var(--red);border-radius:999px;padding:0 16px;height:42px;font-weight:700;font-size:14px}
.ep-new:hover{background:var(--red-hot)}
.ep-search{flex:1;min-width:0;height:42px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:inherit;font-size:15px;padding:0 14px}
.ep-search:focus{outline:none;border-color:var(--muted)}
.ep-list{display:grid;gap:6px;padding:4px 8px}
.ep-season h4{margin:14px 8px 6px;font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ep-season h4 b{color:var(--fg)}
.ep-row{border-radius:12px}
.ep-row.current{background:var(--raise)}
.ep-line-row{display:flex;align-items:stretch}
.ep-open{flex:1;min-width:0;display:grid;grid-template-columns:30px 22px minmax(0,1fr) auto;gap:8px;align-items:center;text-align:left;padding:9px 6px 9px 8px;border-radius:12px}
.ep-open:hover{background:var(--raise)}
.ep-num{font-family:var(--f-display);font-weight:800;font-size:17px;color:var(--muted)}
.ep-wx{font-size:16px;text-align:center}
.ep-tx{display:grid;min-width:0}
.ep-tx b{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ep-tx span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ep-meta{display:grid;justify-items:end;gap:2px}
.ep-meta small{font-size:11px;color:var(--muted);white-space:nowrap}
.ep-badge{font-style:normal;font-size:10.5px;font-weight:700;border-radius:999px;padding:1px 7px;white-space:nowrap}
.ep-badge.ok{color:var(--good);background:color-mix(in srgb,var(--good) 15%,transparent)}
.ep-badge.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,transparent)}
.ep-badge.plain{color:var(--muted);background:var(--raise)}
.ep-more{width:40px;flex:0 0 auto;color:var(--muted);font-size:18px;border-radius:12px}
.ep-more:hover{color:var(--fg);background:var(--raise)}
.savebar{max-width:720px;margin:0 auto 8px;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);font-size:13.5px;color:var(--muted)}
.savebar span{flex:1}
.savebar #savebar-in{color:var(--fg);font-weight:700;padding:6px 10px;border-radius:8px;background:var(--red)}
.savebar #savebar-in:hover{background:var(--red-hot)}
.savebar #savebar-x{width:30px;height:30px;border-radius:50%;color:var(--muted);font-size:18px}
.sheet.signin{gap:10px}
.si-lead{font-size:15.5px}
.si-big{display:grid;gap:2px;text-align:left;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--bg)}
.si-big b{font-size:16px}
.si-big span{font-size:13px;color:var(--muted)}
.si-big:hover{border-color:var(--muted)}
.si-big.red{background:var(--red);border-color:var(--red)}
.si-big.red span{color:color-mix(in srgb,var(--fg) 80%,transparent)}
.si-big.red:hover{background:var(--red-hot)}
.si-big:disabled{opacity:.5}
.si-or{text-align:center;font-size:12px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.si-name{display:grid;gap:6px;font-size:13px;color:var(--muted)}
.si-link{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:13.5px;padding:6px 0;justify-self:center}
.si-link:hover{color:var(--fg)}
.rc-code{font:700 clamp(17px,5vw,21px)/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.06em;text-align:center;padding:16px 12px;border:1.5px dashed var(--muted);border-radius:14px;background:var(--bg);-webkit-user-select:all;user-select:all;overflow-wrap:anywhere}
.rc-input{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.06em;text-transform:uppercase;text-align:center}
.rc-check{display:flex;gap:10px;align-items:center;font-size:14.5px;cursor:pointer}
.rc-check input{width:20px;height:20px;accent-color:var(--red)}
.rc-tip{font-size:13px;color:var(--muted);margin:0}
.ep-sec{display:grid;gap:8px;padding:2px 0 10px;border-bottom:1px solid var(--line)}
.ep-sec h5{margin:0;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ep-item{display:flex;align-items:center;gap:10px;font-size:13.5px}
.ep-item>span{flex:1;min-width:0}
.ep-item small{display:block;color:var(--muted);font-size:12px}
.ep-item .btn{padding:6px 12px;font-size:12.5px;white-space:nowrap}
.ep-item.warn>span b{color:var(--warn)}
.ep-item.ok>span b{color:var(--good)}
/* ===== Sidebar: "midnight broadcast" — its own look, apart from the red app ===== */
.ep-drawer{--bg:#070912;--panel:#0e1222;--raise:#171c33;--line:#232945;--muted:#8f98b8;--fg:#eef0fa;--red:#7c6cff;--red-hot:#998cff;--mint:#4ef0c0;
  background:radial-gradient(120% 50% at 100% 0%,rgba(124,108,255,.16),transparent 60%),radial-gradient(90% 40% at 0% 100%,rgba(78,240,192,.07),transparent 60%),#070912;color:var(--fg)}
.ep-drawer .ep-title,.ep-drawer .ep-phead b,.ep-drawer .ep-tile b,.ep-drawer .ep-signin b{font-family:"Space Grotesk",var(--f-body,system-ui),sans-serif}
.ep-drawer.tvmode{padding-bottom:0}
.tv-top{gap:8px;padding:0 10px 12px 14px}
.tv-brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.tv-logo{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font:700 16px/1 "Space Grotesk",sans-serif;color:#070912;background:conic-gradient(from 210deg,#4ef0c0,#7c6cff,#ff7eb3,#ffb84d,#4ef0c0);box-shadow:0 0 18px rgba(124,108,255,.35)}
.tv-brand b{font:700 16px/1 "Space Grotesk",sans-serif;white-space:nowrap}
.tv-tag{font:12px/1 "Share Tech Mono",ui-monospace,monospace;letter-spacing:.14em;padding:3px 6px;border-radius:5px;border:1px solid rgba(78,240,192,.35);color:var(--mint);text-shadow:0 0 8px rgba(78,240,192,.6)}
.tv-who{color:var(--muted);font-size:12px;max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tv-switch{font-size:12.5px;font-weight:600;padding:7px 11px;border-radius:999px;border:1px solid var(--line);color:var(--fg);background:var(--panel);white-space:nowrap}
.tv-switch:hover{border-color:var(--muted)}
/* command bar */
.cmd{margin:0 12px;display:flex;align-items:center;gap:4px;padding:4px 4px 4px 12px;border-radius:16px;border:1.5px solid transparent;
  background:linear-gradient(var(--panel),var(--panel)) padding-box,linear-gradient(115deg,#4ef0c0,#7c6cff 50%,#ff7eb3) border-box;box-shadow:0 10px 30px rgba(124,108,255,.14);transition:box-shadow .2s}
.cmd:focus-within{box-shadow:0 0 0 4px rgba(124,108,255,.2),0 10px 34px rgba(124,108,255,.28)}
.cmd-g{font:16px/1 "Share Tech Mono",monospace;color:var(--mint);text-shadow:0 0 8px rgba(78,240,192,.6)}
.cmd-in{flex:1;min-width:0;background:none;border:0;color:var(--fg);font:inherit;font-size:16px;padding:9px 4px;outline:none}
.cmd-in::placeholder{color:#7d86a8}
.cmd-mic,.cmd-go{width:38px;height:38px;flex:0 0 auto;border-radius:12px;display:grid;place-items:center;color:var(--fg)}
.cmd-mic svg{width:18px;height:18px}
.cmd-mic:hover{background:var(--raise)}
.cmd-mic.on{background:#ff4d6d;color:#fff;animation:pulse 1.1s ease infinite}
.cmd-go{background:linear-gradient(135deg,#7c6cff,#5a4be0);font-size:14px;box-shadow:0 4px 14px rgba(124,108,255,.4)}
.cmd-out{margin:8px 12px 12px}
.cmd-out:empty{margin-bottom:8px}
.cmd-chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;align-items:center;padding-bottom:2px}
.cmd-chips::-webkit-scrollbar{display:none}
.cmd-chips small{flex:0 0 auto;color:var(--muted);font:11px "Share Tech Mono",monospace;letter-spacing:.12em;text-transform:uppercase}
.cmd-chip{flex:0 0 auto;font-size:13px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--raise);color:var(--fg);white-space:nowrap}
.cmd-chip:hover{border-color:#7c6cff}
.cmd-say{display:flex;align-items:center;gap:9px;font-size:14px;padding:9px 10px;border-radius:12px;background:rgba(78,240,192,.08);border:1px solid rgba(78,240,192,.28);animation:tvIn .25s ease}
.cmd-say>span:nth-child(2){flex:1;min-width:0}
.cmd-say.err{background:rgba(255,184,77,.08);border-color:rgba(255,184,77,.32)}
.cmd-say.busy{background:var(--panel);border-color:var(--line);color:var(--muted)}
.cmd-dot{width:20px;height:20px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--mint);color:#070912}
.cmd-say.err .cmd-dot{background:#ffb84d}
.cmd-say.busy .cmd-dot{background:none;border:2px solid var(--line);border-top-color:var(--mint);animation:spin .8s linear infinite}
.cmd-link{font-weight:700;color:var(--mint);font-size:13.5px;padding:2px 6px;white-space:nowrap}
.cmd-res{display:grid;gap:6px;margin-top:6px}
.cmd-hit{display:grid;gap:1px;text-align:left;padding:9px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);min-width:0}
.cmd-hit:hover{border-color:#7c6cff}
.cmd-hit b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmd-hit span{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* the screen */
.tv-screen{--hue:#4ef0c0;position:relative;margin:0 12px;border-radius:22px;padding:12px 14px;min-height:214px;display:grid;grid-template-rows:auto 1fr auto;gap:8px;overflow:hidden;
  background:radial-gradient(120% 90% at 90% -10%,color-mix(in srgb,var(--hue) 30%,transparent),transparent 60%),radial-gradient(80% 80% at -10% 110%,rgba(124,108,255,.24),transparent 65%),linear-gradient(180deg,#0e1328,#080a16);
  border:1px solid color-mix(in srgb,var(--hue) 38%,#232945);transition:border-color .3s,box-shadow .3s;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),inset 0 0 70px rgba(0,0,0,.55),0 18px 40px rgba(0,0,0,.45),0 0 44px color-mix(in srgb,var(--hue) 15%,transparent)}
.tv-bar{display:flex;align-items:center;gap:8px;font:12px/1 "Share Tech Mono",monospace;letter-spacing:.08em;color:var(--muted);position:relative;z-index:1}
.tv-lcd{color:var(--hue);text-shadow:0 0 10px var(--hue);font-size:14px;padding:4px 7px;border-radius:6px;background:rgba(0,0,0,.4);border:1px solid color-mix(in srgb,var(--hue) 40%,transparent)}
.tv-chname{flex:1;min-width:0;color:var(--fg);font:600 13.5px/1.2 "Instrument Sans",sans-serif;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tv-live{color:#ff6b81;text-shadow:0 0 8px rgba(255,107,129,.6)}
.tv-stage{display:grid;gap:6px;align-content:center;justify-items:start;position:relative;z-index:1;animation:tvIn .35s ease}
.tv-kicker{font:11.5px/1.3 "Share Tech Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:color-mix(in srgb,var(--hue) 70%,#fff)}
.tv-title{font:700 22px/1.12 "Space Grotesk",sans-serif;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tv-quote{margin:0;font-size:14px;line-height:1.42;color:#c9cee3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;quotes:"\201C" "\201D"}
.tv-row{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap}
.tv-play{padding:9px 16px;border-radius:999px;background:var(--hue);color:#070912;font-weight:800;font-size:14px;box-shadow:0 0 24px color-mix(in srgb,var(--hue) 45%,transparent);transition:transform .15s}
.tv-play:hover{transform:translateY(-1px)}
.tv-ghost{padding:9px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.18);font-weight:600;font-size:13.5px;color:var(--fg);background:rgba(0,0,0,.2)}
.tv-epnav{display:flex;align-items:center;gap:8px;color:var(--muted);font:11.5px/1 "Share Tech Mono",monospace;position:relative;z-index:1}
.tv-epnav:empty{display:none}
.tv-ep{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);color:var(--fg);font-size:17px;line-height:1;background:rgba(0,0,0,.25)}
.tv-dots{display:flex;gap:4px;flex:1;align-items:center}
.tv-dots i{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.2);transition:width .2s}
.tv-dots i.on{width:16px;background:var(--hue);box-shadow:0 0 8px var(--hue)}
.tv-scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px)}
.tv-noise{position:absolute;inset:0;pointer-events:none;opacity:0;background:repeating-radial-gradient(circle at 30% 40%,rgba(255,255,255,.4) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(255,255,255,.14) 0 2px,transparent 2px 5px)}
.tv-screen.tuning .tv-noise{animation:tvStatic .34s steps(4)}
.tv-screen.tuning .tv-stage{animation:tvTune .4s ease}
@keyframes tvStatic{0%{opacity:.95;transform:translateX(-5px)}50%{opacity:.6;transform:translateX(4px) scaleY(1.03)}100%{opacity:0;transform:none}}
@keyframes tvTune{0%{opacity:0;filter:blur(6px) brightness(2.2);transform:scaleY(.04)}45%{opacity:1;transform:scaleY(1.03)}100%{filter:none;transform:none}}
@keyframes tvIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
/* the guide */
.tv-guide{margin:16px 0 0;padding:0 0 14px}
.tv-gh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:0 16px 8px}
.tv-gh b{font:700 13px/1 "Space Grotesk",sans-serif;letter-spacing:.16em;text-transform:uppercase}
.tv-gh small{color:var(--muted);font-size:12px;text-align:right}
.tv-grid{overflow-x:auto;padding:0 12px 6px;display:grid;gap:4px;scrollbar-width:thin;scrollbar-color:#2a3150 transparent}
.tv-grid>.ep-note{margin:0 4px}
.tv-row-g{display:grid;grid-template-columns:112px 70px repeat(7,84px);gap:4px}
.tv-chcell{position:sticky;left:0;z-index:2;display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:12.5px;font-weight:600;text-align:left;min-width:0;color:var(--fg);box-shadow:-13px 0 0 #070912,6px 0 10px -4px #070912}
.tv-chcell em{font:11px/1 "Share Tech Mono",monospace;color:var(--hue);font-style:normal}
.tv-chcell span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tv-row-g.on .tv-chcell{border-color:var(--hue);box-shadow:inset 3px 0 0 var(--hue),-13px 0 0 #070912,6px 0 10px -4px #070912}
.tv-head .tv-chcell{background:#070912;border-color:transparent;box-shadow:-13px 0 0 #070912}
.tv-day{font:11px/1 "Share Tech Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:4px 4px 2px}

/* the morphing remote */
.mr{--hue:#4ef0c0;position:sticky;bottom:0;margin-top:auto;z-index:3;padding:6px 12px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,rgba(7,9,18,0),#070912 30%)}

  background:rgba(16,20,40,.62);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border:1px solid rgba(255,255,255,.13);
  box-shadow:0 22px 50px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.16),0 0 44px color-mix(in srgb,var(--hue) 20%,transparent);transition:box-shadow .4s}
.mr-aurora{position:absolute;inset:-60%;z-index:-1;filter:blur(34px);opacity:.42;background:conic-gradient(from 0deg,var(--hue),#7c6cff,#ff7eb3,#ffb84d,var(--hue));animation:mrAur 16s linear infinite;transition:opacity .4s}
@keyframes mrAur{to{transform:rotate(360deg)}}
.mr-petals{display:grid;gap:8px}
.mr-pt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:54px;padding:0 6px;border-radius:20px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#e9ecf8;min-width:0;transition:background-color .2s,transform .12s}
.mr-pt:hover{background:rgba(255,255,255,.14)}
.mr-pt:active{transform:scale(.94)}
.mr-pt svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.mr-pt small{font-size:11px;font-weight:700;letter-spacing:.02em;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mr-pt.hot{background:var(--hue);color:#070912;border-color:transparent;box-shadow:0 0 22px color-mix(in srgb,var(--hue) 55%,transparent)}
.mr-pt.sure{background:#ff4d6d;color:#fff;border-color:transparent}
.mr-petals.morph .mr-pt{animation:mrMorph .5s cubic-bezier(.2,.9,.3,1.25) both}
.mr-petals.morph .mr-pt:nth-child(2){animation-delay:.07s}
@keyframes mrMorph{from{opacity:0;transform:scale(.55) rotate(-8deg);filter:blur(6px);border-radius:50%}}
.mr-lens{position:relative;width:132px;height:132px;border-radius:50%;touch-action:none;cursor:pointer;user-select:none;-webkit-user-select:none;outline:none;
  background:radial-gradient(circle at 50% 28%,rgba(255,255,255,.24),rgba(255,255,255,.05) 42%,rgba(0,0,0,.28) 78%),radial-gradient(circle at 50% 125%,color-mix(in srgb,var(--hue) 55%,transparent),transparent 62%),#0b0f21;
  box-shadow:inset 0 2px 1px rgba(255,255,255,.28),inset 0 -12px 26px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.14),0 0 0 7px rgba(0,0,0,.28),0 0 34px color-mix(in srgb,var(--hue) 40%,transparent);transition:transform .15s,box-shadow .3s}
.mr-lens:focus-visible{outline:3px solid #fff;outline-offset:6px}
.mr-lens.touch{transform:scale(.97)}
.mr-rim{position:absolute;inset:-7px;border-radius:50%;pointer-events:none;opacity:.55;transition:opacity .2s;
  background:conic-gradient(from 0deg,color-mix(in srgb,var(--hue) 90%,#fff) 0 10deg,transparent 40deg 320deg,color-mix(in srgb,var(--hue) 50%,transparent) 350deg);
  -webkit-mask:radial-gradient(circle,transparent 63%,#000 64.5%);mask:radial-gradient(circle,transparent 63%,#000 64.5%);animation:spin 9s linear infinite}
.mr-lens.scrub .mr-rim{animation:none;transform:rotate(var(--a,0deg));opacity:1}
.mr-trail{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;pointer-events:none}
.mr-glow{position:absolute;left:var(--x,50%);top:var(--y,50%);width:74px;height:74px;margin:-37px 0 0 -37px;border-radius:50%;pointer-events:none;opacity:0;transition:opacity .25s;
  background:radial-gradient(circle,color-mix(in srgb,var(--hue) 60%,#fff) 0,color-mix(in srgb,var(--hue) 45%,transparent) 28%,transparent 70%)}
.mr-lens.touch .mr-glow{opacity:.9}
.mr-face{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:5px;pointer-events:none;text-align:center}
.mr-ch{font:16px/1 "Share Tech Mono",monospace;color:var(--hue);text-shadow:0 0 12px var(--hue);letter-spacing:.1em}

@keyframes mrTalk{0%{box-shadow:inset 0 2px 1px rgba(255,255,255,.28),0 0 0 0 color-mix(in srgb,var(--hue) 70%,transparent),0 0 34px color-mix(in srgb,var(--hue) 50%,transparent)}100%{box-shadow:inset 0 2px 1px rgba(255,255,255,.28),0 0 0 22px transparent,0 0 34px color-mix(in srgb,var(--hue) 50%,transparent)}}
.mr-arrow{position:absolute;inset:0;border-radius:50%;pointer-events:none;opacity:0}
.mr-arrow.go{animation:mrSw .45s ease}
.mr-arrow.up{background:linear-gradient(to top,transparent 35%,color-mix(in srgb,var(--hue) 60%,transparent))}
.mr-arrow.down{background:linear-gradient(to bottom,transparent 35%,color-mix(in srgb,var(--hue) 60%,transparent))}

.mr-arrow.right{background:linear-gradient(to right,transparent 35%,color-mix(in srgb,var(--hue) 60%,transparent))}
.mr-arrow.tap{background:radial-gradient(circle,color-mix(in srgb,var(--hue) 65%,transparent),transparent 65%)}

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const thread=$('#thread'),main=$('#main'),form=$('#form'),q=$('#q'),send=$('#send'),hello=$('#hello'),resetBtn=$('#reset'),lockBtn=$('#lock'),memBtn=$('#memory'),pill=$('#pill');
// ---------- home screen: a greeting for today's weather where the visitor is ----------
const WX={
  hot:   {icon:'🥵',word:'Hot & sunny',line:"It's a scorcher out there. Let's find ways to keep you cool.",chips:["How can I keep my place cool without blasting the AC?","Easy no-cook dinners for a hot day","Fun indoor things to do in {city} today"]},
  sunny: {icon:'☀️',word:'Sunny',line:"Beautiful day out there. How can we get started?",chips:["Outdoor things to do in {city} this afternoon","Plan a simple picnic for two","Give me a 20-minute walking workout"]},
  clear: {icon:'🌙',word:'Clear',line:"Quiet, clear night. A good time to plan tomorrow or unwind.",chips:["Help me plan tomorrow in 5 minutes","Recommend a movie for tonight","A short wind-down routine for better sleep"]},
  cloudy:{icon:'☁️',word:'Cloudy',line:"Gray skies, clear head. Let's get something done.",chips:["Plan a 2-hour deep-work block with me","Teach me something interesting in 5 minutes","Make café-style coffee at home"]},
  rain:  {icon:'🌧️',word:'Rainy',line:"Rain outside: the perfect excuse to stay in and dig into something.",chips:["Cozy recipes for a rainy day","Movies for a rainy afternoon","Tips for driving safely in heavy rain"]},
  storm: {icon:'⛈️',word:'Stormy',line:"Storms around. Stay safe inside. I'm here for whatever you need.",chips:["How should I prepare for a thunderstorm?","Things to do if the power goes out","How far away is lightning if I hear thunder 10 seconds later?"]},
  snow:  {icon:'❄️',word:'Snowy',line:"Snow day! Stay warm. What are we working on?",chips:["Tips for driving safely in snow","Warm soups I can make tonight","Fun things to do on a snow day"]},
  fog:   {icon:'🌫️',word:'Foggy',line:"Foggy out there. Take it slow on the roads.",chips:["Tips for driving in fog","Teach me something interesting in 5 minutes","Help me plan my day"]},
  cold:  {icon:'🥶',word:'Chilly',line:"It's cold out there. Warm drink first, then let's get going.",chips:["Warm drinks I can make at home","How to stay warm without cranking the heat","A 15-minute indoor workout"]},
};
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function partOfDay(h){return h<5?'night':h<12?'morning':h<17?'afternoon':h<21?'evening':'night'}
const PARAMS=new URLSearchParams(location.search),EMBED=PARAMS.has('embed');
// Customize settings (see "Customize" below): kept on this device, and in the account when signed in.
const PREF_DEFAULTS={name:'',length:'balanced',tone:'',about:'',city:'',voice:'',rate:1,read_aloud:false,jury:true};
let prefs=(()=>{try{return {...PREF_DEFAULTS,...JSON.parse(localStorage.getItem('askh_prefs')||'{}')}}catch(e){return {...PREF_DEFAULTS}}})();
if(EMBED)document.documentElement.classList.add('embed');
const EMBED_CHIPS=["What does Harsha do at IBM?","Has Harsha shipped anything with AI?","What are his strongest results?","How can I contact Harsha?"];
function greet(w){
  const now=new Date(),part=partOfDay(now.getHours()),day=DAYS[now.getDay()];
  if(EMBED){  // on Harsha's portfolio, visitors came to learn about his work
    const h=$('#hello-h');h.textContent='';h.append("Hi, I'm Harsha's ",el('span',null,'AI agent'));
    $('#wx').hidden=true;$('#owner-tip').hidden=true;
    $('#hello-p').textContent="Ask about his work, or anything else. Answers about Harsha come only from his verified record, with sources you can tap.";
    const box=$('#chips');box.textContent='';
    EMBED_CHIPS.forEach(c=>{const b=el('button','chip',c);b.type='button';b.onclick=()=>ask(c);box.append(b)});
    return;
  }
  const h=$('#hello-h'),p=$('#hello-p'),wx=$('#wx');h.textContent='';
  let chips=[],kind=null;
  if(w&&w.ok){
    kind=WX[w.condition]||WX.cloudy;
    // At night, "sunny" reads wrong: clear skies after dark use the night copy.
    if(w.condition==='sunny'&&(part==='night'||!w.is_day))kind=WX.clear;
    h.append(kind.word+' ',el('span',null,day+(part==='night'||part==='evening'?' '+part:'')));
    wx.textContent='';wx.append(el('span','wi',kind.icon),`${w.temp}°${w.unit}${w.city?' in '+w.city:''}`);
    if(Math.abs(w.feels-w.temp)>=3)wx.append(el('small',null,`feels like ${w.feels}°`));
    wx.hidden=false;p.textContent=(prefs.name?`Hi ${prefs.name}! `:'')+kind.line;
    chips=kind.chips.map(c=>c.replace('{city}',w.city||'my area'));
  }else{
    h.append(`Good ${part==='night'?'evening':part} `,el('span',null,day));
    p.textContent=(prefs.name?`Hi ${prefs.name}! `:'')+"Ask me anything: today's news, code, writing, plans, or Harsha's work.";
    chips=["What's in the news today?","Help me plan my day","Teach me something interesting in 5 minutes"];
  }
  const box=$('#chips');box.textContent='';
  if(part==='morning'){const a=el('a','chip link','☀️ My morning brief');a.href='/tools#morning';box.append(a)}
  if(passcode)chips=["Remember that …",...chips];
  chips.forEach(s=>{const b=el('button','chip',s);b.type='button';b.onclick=()=>{if(s.includes('…')){q.value=s.replace('…','');q.focus();grow()}else ask(s)};box.append(b)});
  $('#owner-tip').hidden=!passcode;
  renderContinue();
}
function renderContinue(){
  const box=$('#cont');if(!box)return;box.textContent='';
  const recent=(signedIn()?[...summaries]:[]).sort((a,b)=>b.updated-a.updated).slice(0,5);
  if(EMBED||!recent.length){box.hidden=true;return}
  const h=el('div','cont-h');h.append(el('b',null,'Continue where you left off'));
  const all=el('button',null,`All chats (${summaries.length}) ›`);all.type='button';all.onclick=openRecents;h.append(all);
  const row=el('div','cont-row');
  recent.forEach(c=>{
    const b=el('button','cc');b.type='button';
    const top=el('div','cc-top');top.append(el('span',null,`${c.wx?c.wx.icon+' ':''}${new Date(c.updated).toLocaleDateString([],{weekday:'short'})}`),el('span',null,`${c.questions} Q`));
    const bar=el('span','cc-bar');const fill=el('i');fill.style.width=Math.min(100,25*c.questions)+'%';bar.append(fill);
    b.append(top,el('b',null,c.title),el('span','cc-sub',highlight(c)),bar);b.onclick=()=>openChat(c.id);row.append(b);
  });
  const more=el('button','cc all','See all your chats ›');more.type='button';more.onclick=openRecents;row.append(more);
  box.append(h,row);box.hidden=false;
}
let weatherData=null;
async function loadWeather(){
  try{const res=await fetch('/api/greeting'+(prefs.city?'?city='+encodeURIComponent(prefs.city):''));const d=await res.json();if(d&&d.ok){weatherData=d;greet(d)}}catch(e){}
}
const KEY='askh_owner';
let history=[],busy=false,passcode='',pendingNames=[];
const cache={};  // id -> {text, kind}

const store={get(){try{return localStorage.getItem(KEY)||''}catch(e){return''}},set(v){try{v?localStorage.setItem(KEY,v):localStorage.removeItem(KEY)}catch(e){}}};
function headers(){const h={'Content-Type':'application/json'};if(passcode)h['X-Owner-Passcode']=passcode;return h}
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
function scrollDown(){requestAnimationFrame(()=>{main.scrollTop=main.scrollHeight})}
function bubble(cls){const d=el('div','msg '+cls);thread.append(d);scrollDown();return d}

function renderChips(owner){greet(weatherData)}
function setOwner(on){
  pill.hidden=true;$('#sub').classList.toggle('owner',on);memBtn.hidden=true;lockBtn.setAttribute('aria-label',on?'Sign out of owner mode':'Owner sign-in');
  $('#sub').textContent=on?'● Owner mode':'AI assistant built by Harsha Reddy';
  if(on)refreshInboxCount();
  renderChips(on);
}

// Answer text with [F14]/[N003] turned into tappable source tags. DOM nodes only, never innerHTML.
function renderAnswer(box,text){
  box.textContent='';
  const re=/\[((?:F\d{2,3})|(?:N\d{3,4}))\]/g;let last=0,m;
  while((m=re.exec(text))){
    if(m.index>last)box.append(text.slice(last,m.index));
    const id=m[1];  // capture now: m is reset by the loop before any click happens
    const b=el('button','cite'+(id.startsWith('N')?' note':''),id);b.type='button';
    b.setAttribute('aria-label',`Source ${id}`);b.onclick=()=>openSource(id);
    box.append(b);last=re.lastIndex;
  }
  if(last<text.length)box.append(text.slice(last));
}
function renderExtras(box,data){
  const x=el('div','extras');
  (data.memory_changes||[]).forEach(c=>x.append(el('div','saved',(c.action==='added'?'Saved to memory as ':'Removed from memory: ')+c.id+(c.action==='added'?'':'')+' · '+c.text)));
  if(data.web_sources&&data.web_sources.length){
    const s=el('div','sources');
    data.web_sources.forEach(w=>{let host='';try{host=new URL(w.url).hostname.replace(/^www\./,'')}catch(e){}const a=el('a','src',host||w.title);a.href=w.url;a.target='_blank';a.rel='noopener';a.title=w.title;s.append(a)});
    x.append(s);
  }
  const label=data.label||(data.kind==='grounded'?'record':(data.web_sources&&data.web_sources.length?'web':'general'));
  if(label!=='none'){
    const v=el('div','verdict');v.append(el('i'));
    const n=(data.citations||[]).length,s=n===1?'':'s';
    const where={record:"Harsha's record",memory:"Harsha's memory",mixed:"Harsha's record and memory"}[label];
    if(where&&data.grounded){v.append(`Checked against ${n} source${s} in ${where}`)}
    else if(where){v.classList.add('warn');v.append(`Some details couldn't be verified against ${where}`)}
    else if(label==='web'){v.classList.add('plain');v.append('From the web')}
    else if(label==='file'){v.classList.add('plain');v.append(data.web_sources&&data.web_sources.length?'From your file and the web':'Read from your file')}
    else{v.classList.add('plain');v.append('From general knowledge')}
    x.append(v);
  }
  const steps=data.trace||[];
  if(!steps.length&&label!=='none'){
    const d=el('details','how');d.append(el('summary',null,'How I got this · no lookups needed'));
    d.append(el('p','direct',label==='file'?"Read your attached file and answered in one step. It didn't need to search the web, Harsha's record or memory.":"Answered straight from the model's own knowledge in one step. It didn't need to search the web, Harsha's record or memory."));
    x.append(d);
  }
  if(steps.length){
    const d=el('details','how');const sm=el('summary',null,`How I got this · ${steps.length} lookup${steps.length===1?'':'s'}`);d.append(sm);
    const ol=el('ol','steps');
    steps.forEach(st=>{const li=el('li');li.append(el('span','sk',STEP_LABEL[st.kind]||st.kind));
      if(st.query)li.append(el('span','sq',`“${st.query}”`));
      if(st.error)li.append(el('span','se',st.error));
      else if(st.found&&st.found.length){const f=el('span','sf');st.found.forEach(id=>{const b=el('button','cite'+(id.startsWith('N')?' note':''),id);b.type='button';b.onclick=()=>openSource(id);f.append(b)});li.append(f)}
      else if(st.kind!=='web_search'&&st.kind!=='suggest_asking_harsha')li.append(el('span','sn','nothing found'));
      ol.append(li)});
    const fin=el('li');fin.append(el('span','sk','Wrote the answer'));if(label!=='general'&&label!=='none'&&label!=='web'&&label!=='file')fin.append(el('span','sn','then the grounding check verified every citation'));ol.append(fin);
    d.append(ol);x.append(d);
  }
  box.append(x);
}
const STEP_LABEL={suggest_asking_harsha:'Offered to ask the real Harsha',web_search:'Searched the web',search_facts:"Searched Harsha's career facts",get_topic:"Opened a topic in Harsha's record",list_topics:"Listed the topics in Harsha's record",search_notes:"Searched Harsha's memory",remember_note:'Saved to memory',forget_note:'Removed from memory'};

function sheet(build,opts){
  const sticky=!!(opts&&opts.sticky);  // sticky: only its own buttons close it (used for the recovery code)
  const bg=el('div','sheet-bg'),s=el('div','sheet');s.setAttribute('role','dialog');
  s.append(el('div','grip'));const close=()=>{bg.remove();document.removeEventListener('keydown',esc)};
  function esc(e){if(e.key==='Escape'&&!sticky)close()}
  build(s,close);bg.append(s);document.body.append(bg);
  bg.onclick=e=>{if(e.target===bg&&!sticky)close()};document.addEventListener('keydown',esc);
  const f=s.querySelector('input:not([data-nofocus]),button.primary,button');if(f)f.focus();
}
function openSource(id){
  const c=cache[id];
  sheet((s,close)=>{
    const h=el('h3',c&&c.kind==='note'?'note':'',c&&c.kind==='note'?`Memory ${id}`:`Source ${id}`);
    s.append(h,el('p',null,c?c.text:'Source text unavailable.'),el('small',null,c&&c.kind==='note'?'Something Harsha taught the assistant.':"From Harsha's verified record."));
    const r=el('div','row'),b=el('button','btn','Close');b.type='button';b.onclick=close;r.append(b);s.append(r);
  });
}
function openLock(){
  if(passcode){
    sheet((s,close)=>{
      s.append(el('h3',null,'Owner mode'),el('p',null,'You are signed in as Harsha on this device.'));
      const tools=el('div','tools');
      const ev=el('button','tool');ev.type='button';ev.append(el('b',null,'Run evals'),el('span',null,'Ask the test questions as a visitor and score every answer. Takes a few minutes and about 20 to 40 cents.'));
      ev.onclick=()=>{close();openEvals()};
      const ib=el('button','tool');ib.type='button';ib.append(el('b',null,inboxCount?`Inbox · ${inboxCount} waiting`:'Inbox'),el('span',null,'Questions visitors sent to the real you. Answer once, and optionally teach the agent.'));
      ib.onclick=()=>{close();openInbox()};
      const mb=el('button','tool');mb.type='button';mb.append(el('b',null,'Memory'),el('span',null,'Everything you have taught the agent. Remove any note.'));
      mb.onclick=()=>{close();openMemory()};tools.append(ib,mb,ev);s.append(tools);
      const r=el('div','row'),out=el('button','btn','Sign out'),ok=el('button','btn red primary','Done');
      out.type=ok.type='button';out.onclick=()=>{passcode='';store.set('');setOwner(false);close()};ok.onclick=close;r.append(out,ok);s.append(r);
    });return;
  }
  sheet((s,close)=>{
    s.append(el('h3',null,'Owner sign-in'),el('small',null,'Only Harsha can teach this assistant. Enter your passcode to unlock memory on this device.'));
    const f=el('form');f.style.display='grid';f.style.gap='10px';
    const inp=el('input','field');inp.type='password';inp.autocomplete='current-password';inp.placeholder='Passcode';inp.setAttribute('aria-label','Passcode');
    const line=el('p','msgline'),r=el('div','row'),cancel=el('button','btn','Cancel'),go=el('button','btn red','Unlock');
    cancel.type='button';cancel.onclick=close;go.type='submit';r.append(cancel,go);f.append(inp,line,r);s.append(f);
    f.onsubmit=async e=>{e.preventDefault();const p=inp.value;if(!p)return;go.disabled=true;line.textContent='';
      try{const res=await fetch('/api/owner/check',{method:'POST',headers:{'X-Owner-Passcode':p}});const d=await res.json().catch(()=>({}));
        if(res.ok&&d.owner){passcode=p;store.set(p);setOwner(true);close()}else line.textContent=d.message||'That passcode isn\'t right.'}
      catch(err){line.textContent="Couldn't connect. Try again."}finally{go.disabled=false}};
  });
}
function openEvals(){
  sheet(async (s,close)=>{
    s.append(el('h3',null,'Evals'));
    const head=el('p','evhead','Starting…'),bar=el('div','evbar'),fill=el('i');bar.append(fill);
    const list=el('div','evlist'),r=el('div','row'),b=el('button','btn','Close');b.type='button';b.onclick=close;r.append(b);
    s.append(head,bar,list,r);
    let total=0;
    try{
      const res=await fetch('/api/owner/evals',{method:'POST',headers:headers()});
      const type=res.headers.get('content-type')||'';
      if(!res.ok||!type.includes('text/event-stream')){const d=await res.json().catch(()=>({}));head.textContent=d.message||'Evals could not start.';bar.remove();return}
      await readSSE(res,(kind,d)=>{
        if(kind==='start'){total=d.total;head.textContent=`Running 0 of ${total}…`}
        else if(kind==='case'){
          fill.style.width=(d.n/total*100)+'%';head.textContent=`Running ${d.n} of ${total}…`;
          const row=el('details','evrow '+(d.pass?'pass':'fail'));
          const sm=el('summary');sm.append(el('span','evmark',d.pass?'PASS':'FAIL'),el('span','q',d.question));row.append(sm);
          if(!d.pass)row.append(el('p','why',d.failures.join('; ')));
          row.append(el('p','ans',d.answer||'(no answer)'),el('p','meta',`${d.seconds}s · $${d.cost_usd.toFixed(3)}`));
          list.append(row);
        }
        else if(kind==='stopped'){head.textContent=d.message}
        else if(kind==='summary'){
          fill.style.width='100%';const pct=d.total?Math.round(d.passed/d.total*100):0;
          head.textContent='';head.append(el('b',null,`${d.passed} of ${d.total} passed (${pct}%)`),` · $${d.cost_usd.toFixed(2)} · ${Math.round(d.seconds)}s · ${d.model}`);
        }
      });
    }catch(e){head.textContent="Lost connection during the run. Results so far are shown below."}
  });
}
function openMemory(){
  sheet(async (s,close)=>{
    s.append(el('h3','note','Memory'),el('small',null,'Everything here is visible to anyone who chats with the assistant.'));
    const list=el('div','notes');list.append(el('small',null,'Loading...'));s.append(list);
    const r=el('div','row'),b=el('button','btn','Close');b.type='button';b.onclick=close;r.append(b);s.append(r);
    try{
      const res=await fetch('/api/notes',{headers:headers()});const d=await res.json().catch(()=>({}));list.textContent='';
      if(!res.ok){list.append(el('small',null,d.message||'Could not load memory.'));return}
      if(!d.notes.length){list.append(el('small',null,'Nothing yet. Say "remember that ..." in the chat.'));return}
      d.notes.slice().reverse().forEach(n=>{

// Read a Server-Sent Events response, calling onEvent(kind, data) for each event.
async function readSSE(res,onEvent){
  const reader=res.body.getReader(),dec=new TextDecoder();let buf='';
  for(;;){
    const {value,done}=await reader.read();if(done)break;
    buf+=dec.decode(value,{stream:true});
    let i;while((i=buf.indexOf('\n\n'))>=0){
      const block=buf.slice(0,i);buf=buf.slice(i+2);let kind=null,data='';
      block.split('\n').forEach(l=>{if(l.startsWith('event: '))kind=l.slice(7);else if(l.startsWith('data: '))data+=l.slice(6)});
      if(kind){let d={};try{d=JSON.parse(data||'{}')}catch(e){}onEvent(kind,d)}
    }
  }
}

async function api(method,url,body){
  const res=await fetch(url,{method,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined,credentials:'same-origin'});

// ---------- passkeys ----------
// The browser creates or uses a passkey (Face ID, fingerprint or device PIN); the server checks it.
const b64uToBuf=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');const bin=atob(s+'='.repeat((4-s.length%4)%4));const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a.buffer};
const bufToB64u=b=>{const a=new Uint8Array(b);let s='';for(let i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const passkeysOK=()=>!!(window.PublicKeyCredential&&navigator.credentials&&navigator.credentials.create);
function credJSON(c){
  const r=c.response,out={id:c.id,rawId:bufToB64u(c.rawId),type:c.type,clientExtensionResults:c.getClientExtensionResults?c.getClientExtensionResults():{},response:{clientDataJSON:bufToB64u(r.clientDataJSON)}};
  if(c.authenticatorAttachment)out.authenticatorAttachment=c.authenticatorAttachment;
  if(r.attestationObject){out.response.attestationObject=bufToB64u(r.attestationObject);if(r.getTransports)out.response.transports=r.getTransports()}
  if(r.authenticatorData){out.response.authenticatorData=bufToB64u(r.authenticatorData);out.response.signature=bufToB64u(r.signature);if(r.userHandle)out.response.userHandle=bufToB64u(r.userHandle)}
  return out;
}
async function createPasskey(name){
  const {cid,options:o}=await api('POST','/api/auth/register/options',{name});
  o.challenge=b64uToBuf(o.challenge);o.user.id=b64uToBuf(o.user.id);(o.excludeCredentials||[]).forEach(x=>x.id=b64uToBuf(x.id));
  const cred=await navigator.credentials.create({publicKey:o});
  return api('POST','/api/auth/register/verify',{cid,credential:credJSON(cred)});
}
async function usePasskey(){
  const {cid,options:o}=await api('POST','/api/auth/login/options');
  o.challenge=b64uToBuf(o.challenge);(o.allowCredentials||[]).forEach(x=>x.id=b64uToBuf(x.id));
  const cred=await navigator.credentials.get({publicKey:o});
  return api('POST','/api/auth/login/verify',{cid,credential:credJSON(cred)});
}
function passkeyError(e){
  if(e&&e.name==='NotAllowedError')return'Cancelled, or it timed out. Try again when you are ready.';
  if(e&&e.name==='InvalidStateError')return'This device already has a passkey for Ask Harsha. Use "Sign in with a passkey" instead.';
  if(e&&e.name==='SecurityError')return"Passkeys don't work on this address. Open ask-harsha.onrender.com directly.";
  return (e&&e.message)||'Something went wrong. Please try again.';
}

    dl.onclick=()=>download('ask-harsha-recovery-code.txt',text,'text/plain');

// ---------- "Previously on…": past chats as a show ----------
// A drawer from the left. It opens with a short recap of your latest chats, then lists every chat as an episode,
// grouped into seasons (one season per week, counted from your first chat). Each episode carries the weather of
// the day it started and a badge for how its answers were sourced.
const DAY=864e5;
function weekStart(t){const d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()}  // Monday
function cleanLine(t){return (t||'').replace(/\[(F\d{2,3}|N\d{3,4})\]/g,'').replace(/[*#>`]/g,'').replace(/\s+/g,' ').replace(/\s+([.,;:!?])/g,'$1').trim()}
function highlight(c){
  const t=cleanLine(c.last_answer||'');if(!t)return'';const m=t.match(/^.{20,140}?[.!?](\s|$)/);return (m?m[0]:t.slice(0,120)+(t.length>120?'…':'')).trim();
}
function badge(c){
  const ls=c.labels||[];
  if(ls.some(([l,g])=>['record','memory','mixed'].includes(l)&&g))return['✓ verified','ok'];
  if(ls.some(([l])=>['record','memory','mixed'].includes(l)))return['! check','warn'];
  if(ls.some(([l])=>l==='web'))return['web','plain'];
  if(ls.some(([l])=>l==='file'))return['file','plain'];
  return null;
}

function openSidebar(start,arg){
  if(document.querySelector('.ep-drawer'))return;
  const bg=el('div','ep-bg'),dr=el('aside','ep-drawer');dr.setAttribute('role','dialog');dr.setAttribute('aria-label','Menu');
  let timer=null;
  const close=()=>{clearInterval(timer);dr.classList.add('out');bg.classList.add('out');setTimeout(()=>{bg.remove();document.removeEventListener('keydown',esc)},220);$('#recents').focus()};
  function esc(e){
    if(e.key==='Escape'){if(cmdRec){try{cmdRec.stop()}catch(x){}}close();return}
    const typing=/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement||{}).tagName||'');
    if(!tvEls||typing||e.metaKey||e.ctrlKey||e.altKey)return;
    const k={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key];
    if(k){e.preventDefault();tvEls[k]()}else if(e.key==='Enter'&&document.activeElement===document.body){e.preventDefault();tvEls.ok()}
    else if(e.key==='/'){e.preventDefault();cmdUI&&cmdUI.inp.focus()}
  }
  document.addEventListener('keydown',esc);bg.onclick=e=>{if(e.target===bg)close()};
  const view=el('div','ep-view');dr.append(view);
  const go=(section,a)=>{clearInterval(timer);view.textContent='';dr.scrollTop=0;tvEls=null;cmdUI=null;dr.classList.remove('tvmode');
    if(!section)(sbView()==='tv'?tvHome():home());else panel(section,a);
    const f=view.querySelector('.ep-back,.ep-x');if(f)f.focus()};
  const topBar=(title,back)=>{
    const top=el('div','ep-top');
    if(back){const b=el('button','ep-back','‹ Back');b.type='button';b.onclick=back;top.append(b,el('b','ep-title',title))}
    else{const brand=el('div','ep-brand'),bt=el('div');bt.append(el('b',null,'Ask Harsha'),el('small',null,signedIn()?`Signed in as ${me.user.name||'you'}`:'Not signed in · nothing is saved'));brand.append(el('span','ep-h','H'),bt);top.append(brand)}
    const x=el('button','ep-x','×');x.type='button';x.setAttribute('aria-label','Close');x.onclick=close;top.append(x);view.append(top);
  };

  // ----- home (list view): tiles, then chats -----
  function home(){
    homeTop();cmdBar();
    const tiles=el('nav','ep-tiles');tiles.setAttribute('aria-label','Sections');
    SECTIONS.forEach(s=>{const t=el('button','ep-tile t-'+s.id);t.type='button';const ic=el('span','ic');ic.innerHTML=SB_ICONS[s.id];
      t.append(ic,el('b',null,s.name),el('small',null,s.sub()));t.onclick=()=>go(s.id);tiles.append(t)});
    view.append(tiles);
    if(!me.enabled){view.append(el('p','ep-note ep-pad','Saving chats isn’t switched on for this site yet.'));return}
    if(!signedIn()){
      const card=el('section','ep-signin');card.append(el('div','ep-prev','Your chats'),el('b',null,'Sign in to save your chats'),
        el('p',null,'Use Face ID, your fingerprint or your device PIN. No password, no email. Then your chats, projects and saved answers follow you to every device.'));
      const b=el('button','btn red','Sign in with a passkey');b.type='button';b.onclick=()=>{close();openSignIn()};card.append(b);view.append(card);return;
    }
    chatsHome();

    const out=el('button','btn','Sign out');out.type='button';out.onclick=()=>{close();signOut()};wr.append(out);foot.append(wr);view.append(foot);
  }
  function chatsHome(){
    const head=el('div','ep-sechead');head.append(el('h4',null,'Your chats'),el('small',null,`${summaries.length} saved`));view.append(head);
    const recent=[...summaries].sort((a,b)=>b.updated-a.updated).filter(c=>highlight(c)).slice(0,4).reverse();
    const reel=el('section','ep-reel');
    if(recent.length){
      reel.append(el('div','ep-prev','Previously on'),el('div','ep-show',"Ask Harsha"));
      const stage=el('button','ep-stage');stage.type='button';const segs=el('div','ep-segs');
      recent.forEach(()=>{const g=el('span');g.append(el('i'));segs.append(g)});
      const ctrl=el('div','ep-ctrl'),skip=el('button','ep-skip','Skip ▸');skip.type='button';ctrl.append(segs,skip);
      reel.append(stage,ctrl);
      let i=-1,done=false;
      const show=k=>{const c=recent[k];stage.textContent='';stage.onclick=()=>{close();openChat(c.id)};
        const when=new Date(c.updated).toLocaleDateString([],{weekday:'long'});
        stage.append(el('q','ep-line',highlight(c)),el('span','ep-from',`${c.wx?c.wx.icon+' ':''}${when} · ${c.title}`));
        stage.setAttribute('aria-label',`${c.title}: open this chat`);
        [...segs.children].forEach((g,j)=>{g.className=j<k?'done':j===k?'on':''})};
      const finish=()=>{if(done)return;done=true;clearInterval(timer);[...segs.children].forEach(g=>g.className='done');reel.classList.add('ended');
        skip.textContent='↺ Replay';skip.onclick=()=>{done=false;reel.classList.remove('ended');i=-1;step();timer=setInterval(step,2100);skip.textContent='Skip ▸';skip.onclick=finish}};
      const step=()=>{i++;if(i>=recent.length){finish();show(recent.length-1);return}show(i)};
      skip.onclick=finish;
      if(matchMedia('(prefers-reduced-motion: reduce)').matches){show(recent.length-1);finish()}
      else{step();timer=setInterval(step,2100)}
    }else{
      reel.classList.add('empty');reel.append(el('div','ep-prev','Coming soon'),el('div','ep-show','Episode 1'),el('p','ep-note','Your chats will appear here after you ask something.'));
    }
    view.append(reel);
    const tools=el('div','ep-tools');
    const nb=el('button','ep-new','+ New chat');nb.type='button';nb.onclick=()=>{close();newChat();q.focus()};
    const search=el('input','ep-search');search.type='search';search.placeholder='Search your chats';search.setAttribute('aria-label','Search your chats');
    tools.append(nb,search);view.append(tools);
    const list=el('div','ep-list');view.append(list);
    let found=null,seq=0;
    const draw=()=>{list.textContent='';const term=search.value.trim();
      const hits=term?(found||[]):summaries;
      if(term&&found===null){list.append(el('p','ep-note','Searching…'));return}
      if(summaries.length&&!hits.length){list.append(el('p','ep-note','No chats match.'));return}
      episodeList(list,hits,draw)};
    search.oninput=()=>{const term=search.value.trim();found=null;const my=++seq;draw();if(!term)return;
      clearTimeout(search.t);search.t=setTimeout(async()=>{try{const d=await api('GET','/api/chats?q='+encodeURIComponent(term));if(my===seq){found=d.chats||[];draw()}}catch(e){if(my===seq){found=[];draw()}}},250)};
    draw();
  }
  // Chats as episodes, grouped into one season per week (counted from your first chat).
  function episodeList(list,hits,redraw){
    const first=summaries.length?Math.min(...summaries.map(c=>c.created||c.updated)):Date.now();
    const thisWeek=weekStart(Date.now()),seasons=new Map();
    hits.forEach(c=>{const w=weekStart(c.created||c.updated);if(!seasons.has(w))seasons.set(w,[]);seasons.get(w).push(c)});
    [...seasons.keys()].sort((a,b)=>b-a).forEach(w=>{
      const n=Math.round((w-weekStart(first))/(7*DAY))+1;
      const label=w===thisWeek?'This week':w===thisWeek-7*DAY?'Last week':'Week of '+new Date(w).toLocaleDateString([],{month:'short',day:'numeric'});
      const sec=el('section','ep-season');const h=el('h4');h.append(el('b',null,label),` · Season ${n}`);sec.append(h);
      const eps=seasons.get(w).sort((a,b)=>(a.created||a.updated)-(b.created||b.updated));
      eps.map((c,k)=>[c,k+1]).reverse().forEach(([c,num])=>sec.append(episodeRow(c,`E${num}`,redraw)));
      list.append(sec);
    });
  }
  function episodeRow(c,num,redraw){
    const row=el('div','ep-row'+(c.id===chatId?' current':''));
    const open=el('button','ep-open');open.type='button';
    const p=c.project&&projectById(c.project);
    const n=el('span','ep-num',num),wx=el('span','ep-wx',c.wx?c.wx.icon:'·');wx.title=c.wx?`${c.wx.temp}°${c.wx.unit}`:'';
    const tx=el('span','ep-tx'),tl=el('b',null,c.title);if(p)tl.prepend(el('i','ep-ptag',p.icon+' '+p.name));
    tx.append(tl,el('span',null,highlight(c)));
    const meta=el('span','ep-meta');const bd=badge(c);if(bd)meta.append(el('i','ep-badge '+bd[1],bd[0]));
    open.append(n,wx,tx,meta);open.title=`${new Date(c.updated).toLocaleDateString([],{weekday:'long',month:'short',day:'numeric'})} · ${c.questions} question${c.questions===1?'':'s'}`;open.onclick=()=>{close();openChat(c.id)};
    const more=el('button','ep-more','⋯');more.type='button';more.setAttribute('aria-label',`Options for ${c.title}`);
    const acts=el('div','racts');acts.hidden=true;
    const rn=el('button','btn','Rename'),mv=el('button','btn','Move to project'),dl=el('button','btn','Download'),del=el('button','btn','Delete');[rn,mv,dl,del].forEach(b=>b.type='button');
    rn.onclick=()=>{const inp=el('input','field');inp.value=c.title;inp.maxLength=80;acts.textContent='';const ok=el('button','btn red','Save');ok.type='button';
      ok.onclick=async()=>{const v=inp.value.trim();if(v){try{await api('PATCH','/api/chats/'+encodeURIComponent(c.id),{title:v});c.title=v;if(cur&&cur.id===c.id)cur.title=v}catch(e){toast(e.message)}}redraw()};inp.onkeydown=e=>{if(e.key==='Enter')ok.click()};acts.append(inp,ok);inp.focus()};
    mv.onclick=()=>{acts.textContent='';const sel=el('select','field');sel.setAttribute('aria-label','Project');
      sel.append(new Option('No project',''));projects.forEach(pr=>sel.append(new Option(pr.icon+' '+pr.name,pr.id)));sel.value=c.project||'';
      const ok=el('button','btn red','Move');ok.type='button';
      if(!projects.length){acts.append(el('span','ep-note','Make a project first, under Projects.'));return}
      ok.onclick=async()=>{try{await api('PUT','/api/chats/'+encodeURIComponent(c.id)+'/project',{project:sel.value});
        projects.forEach(pr=>{if(pr.id===c.project)pr.chats--;if(pr.id===sel.value)pr.chats++});
        c.project=sel.value||null;summaries.forEach(s=>{if(s.id===c.id)s.project=c.project});if(cur&&cur.id===c.id){cur.project=c.project;renderProjChip()}
        toast(c.project?`Moved to ${projectById(c.project).name}.`:'Removed from the project.')}catch(e){toast(e.message)}redraw()};
      acts.append(sel,ok)};
    dl.onclick=async()=>{try{const full=await api('GET','/api/chats/'+encodeURIComponent(c.id));download(`${c.title.replace(/[^\w\- ]+/g,'').slice(0,40)||'chat'}.md`,chatMarkdown(full),'text/markdown')}catch(e){toast(e.message)}};
    del.onclick=async()=>{if(del.dataset.sure){try{await api('DELETE','/api/chats/'+encodeURIComponent(c.id));summaries=summaries.filter(y=>y.id!==c.id);if(chatId===c.id)newChat();renderContinue()}catch(e){toast(e.message)}redraw()}else{del.dataset.sure='1';del.textContent='Tap again to delete';del.classList.add('red')}};
    acts.append(rn,mv,dl,del);more.onclick=()=>{acts.hidden=!acts.hidden};
    const line=el('div','ep-line-row');line.append(open,more);row.append(line,acts);return row;
  }
  function whoRow(){
    const who=el('div','ep-who');const av=el('span','ep-av',(me.user.name||'A').trim().charAt(0).toUpperCase()||'A');
    const wt=el('div');wt.append(el('b',null,me.user.name||'Ask Harsha user'),el('small',null,'Signed in with a passkey · since '+new Date(me.user.created).toLocaleDateString([],{month:'short',day:'numeric',year:'numeric'})));who.append(av,wt);

  function needSignIn(what){
