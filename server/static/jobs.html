<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Job Pilot</title>
<meta name="description" content="Finds product roles, researches each one, tailors and checks the résumé, and prepares applications overnight.">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<link rel="icon" href="/static/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#0b0b0b; --panel:#171717; --raise:#232323; --line:#2e2e2e;
  --fg:#f5f5f1; --muted:#a3a3a3; --red:#e50914; --red-hot:#ff2a36; --good:#46d369; --warn:#f2b445; --blue:#7cb7ff; --bad:#ff6b6b;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
a{color:var(--blue)}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top,0px)) var(--gr) 10px var(--gl);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.back{display:grid;place-items:center;width:44px;height:44px;margin-left:-10px;color:var(--muted);text-decoration:none;border-radius:12px}
.back svg{width:22px;height:22px}
.who{flex:1;min-width:0}
.who h1{margin:0;font-family:var(--f-display);font-weight:900;text-transform:uppercase;font-size:28px;line-height:.95}
.who h1 span{color:var(--red)}
.who p{margin:0;font-size:13px;color:var(--muted)}
main{max-width:820px;margin:0 auto;padding:16px var(--gr) calc(40px + env(safe-area-inset-bottom,0px)) var(--gl);display:grid;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:10px;min-width:0}
.card>*,details>*{min-width:0;max-width:100%}
.card h2{margin:0;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.card h3{margin:4px 0 0;font-size:15px}
.fine{font-size:12.5px;color:var(--muted);margin:0}
.warnline{font-size:13.5px;color:var(--warn);margin:0}
.tabs{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px;justify-self:start}
.tabs button{padding:7px 16px;border-radius:999px;font-size:14px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--raise);color:var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:6px 12px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
.chip.on{border-color:var(--fg);background:var(--raise)}
.chip b{margin-left:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:var(--raise);border-radius:999px;padding:9px 16px;font-size:14px;font-weight:600;color:var(--fg);text-decoration:none;display:inline-block}
.btn.red{background:var(--red)}
.btn.red:hover{background:var(--red-hot)}
.btn.small{padding:6px 12px;font-size:13px}
.list{display:grid;gap:8px}
.app{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;text-align:left;width:100%;padding:10px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.app b{font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.app small{color:var(--muted);font-size:12.5px;grid-column:1}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--raise);color:var(--muted)}
.s-ready,.s-submitted{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.s-needs_you{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.s-filled,.s-applying{background:color-mix(in srgb,var(--blue) 18%,transparent);color:var(--blue)}
.s-failed{background:color-mix(in srgb,var(--bad) 20%,transparent);color:var(--bad)}
.sp-high{color:var(--good)}.sp-medium{color:var(--blue)}.sp-low,.sp-excluded{color:var(--bad)}.sp-unknown{color:var(--muted)}
.detail{display:grid;gap:10px}
.brief p{margin:0;font-size:14.5px}
ul.plain{margin:0;padding-left:18px;display:grid;gap:3px;font-size:13.5px}
.issue{font-size:13px;padding:6px 10px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.issue.bad{border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.ans{display:grid;gap:2px;padding:8px 10px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:13.5px}
.ans small{color:var(--muted);font-size:12px}
.ans.need{border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
pre.cv{white-space:pre-wrap;margin:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px;max-height:340px;overflow:auto}
.shots img{max-width:100%;border-radius:10px;border:1px solid var(--line)}
label.f{display:grid;gap:5px;font-size:13px;color:var(--muted)}
input.field,select.field,textarea.field{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:15px;color:var(--fg)}
textarea.field{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px}
.tog small{display:block;color:var(--muted);font-size:12.5px}
.sw{position:relative;width:46px;height:28px;border-radius:999px;background:var(--raise);flex:0 0 auto;border:1px solid var(--line)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:left .15s}
.sw[aria-checked=true]{background:color-mix(in srgb,var(--good) 40%,var(--raise))}
.sw[aria-checked=true]::after{left:21px;background:var(--fg)}
code.tok{font-family:var(--f-mono);font-size:12.5px;word-break:break-all;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;display:block}
.st{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--fg);animation:spin .8s linear infinite;flex:0 0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;max-width:min(520px,calc(100vw - 32px));z-index:30}
</style>
</head>
<body>
<header>
  <a class="back" href="/" aria-label="Back to chat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
  <div class="who"><h1>Job <span>Pilot</span></h1><p id="sub">Finds, researches, tailors and checks, while you sleep</p></div>
</header>
<main>
  <p class="warnline" id="gate" hidden></p>
  <div class="tabs" id="tabs" hidden><button type="button" class="on" data-t="track">Applications</button><button type="button" data-t="set">Settings</button></div>

  <section id="track" hidden>
    <div class="card">
      <div class="row" style="justify-content:space-between"><h2>Tonight</h2><span class="fine" id="mode"></span></div>
      <p class="fine" id="lastrun"></p>
      <div class="row"><button class="btn red" id="runnow" type="button">Run now</button><span class="fine">Finds and prepares applications now instead of waiting for tonight. A few dollars for a full run.</span></div>
      <div class="st" id="live" hidden><span class="spin"></span><span id="livetext"></span></div>
    </div>
    <div class="card">
      <div class="chips" id="filters"></div>
      <div class="list" id="apps"><p class="fine">Loading…</p></div>
    </div>
    <div class="card" id="detail" hidden></div>
  </section>

  <section id="set" hidden>
    <div class="card" id="c-resume"></div>
    <div class="card" id="c-rules"></div>
    <div class="card" id="c-sheet"></div>
    <div class="card" id="c-runner"></div>
  </section>
</main>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
let toastT=null;function toast(t){let b=$('.toast');if(!b){b=el('div','toast');document.body.append(b)}b.textContent=t;b.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{b.hidden=true},4500)}
const passcode=(()=>{try{return localStorage.getItem('askh_owner')||''}catch(e){return''}})();
function headers(){const h={'Content-Type':'application/json'};if(passcode)h['X-Owner-Passcode']=passcode;return h}
async function api(method,url,body){const res=await fetch(url,{method,headers:headers(),body:body?JSON.stringify(body):undefined,credentials:'same-origin'});const d=await res.json().catch(()=>({}));if(!res.ok){const e=new Error(d.message||'Something went wrong.');e.status=res.status;throw e}return d}
async function readSSE(res,onEvent){const reader=res.body.getReader(),dec=new TextDecoder();let buf='';
  for(;;){const {value,done}=await reader.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;
    while((i=buf.indexOf('\n\n'))>=0){const block=buf.slice(0,i);buf=buf.slice(i+2);let kind=null,data='';block.split('\n').forEach(l=>{if(l.startsWith('event: '))kind=l.slice(7);else if(l.startsWith('data: '))data+=l.slice(6)});if(kind){let d={};try{d=JSON.parse(data||'{}')}catch(e){}onEvent(kind,d)}}}}
function toggle(on,onChange,label){const b=el('button','sw');b.type='button';b.setAttribute('role','switch');b.setAttribute('aria-checked',!!on);b.setAttribute('aria-label',label);b.onclick=()=>{const v=b.getAttribute('aria-checked')!=='true';b.setAttribute('aria-checked',v);onChange(v)};return b}
const STATUS={ready:'Ready',needs_you:'Needs you',filled:'Filled (dry run)',applying:'Applying',submitted:'Submitted',found:'Waiting',skipped:'Skipped',failed:'Failed'};
const SPONSOR={high:'Likely sponsors',medium:'Sometimes sponsors',low:'Rarely sponsors',unknown:'Sponsorship unknown',excluded:'Won’t sponsor'};
let prof=null,filter='ready';

// ---------- tabs ----------
$('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{$('#tabs').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));$('#track').hidden=b.dataset.t!=='track';$('#set').hidden=b.dataset.t!=='set';if(b.dataset.t==='set')drawSettings()});

async function load(){
  try{prof=await api('GET','/api/jobs/profile')}
  catch(e){const g=$('#gate');g.hidden=false;g.textContent=passcode?e.message:'Job Pilot is for the owner: on the chat page, sign in with your passkey and unlock owner mode (the lock icon), then come back.';return}
  $('#tabs').hidden=false;$('#track').hidden=false;
  $('#mode').textContent=!prof.enabled?'Off':prof.rules.dry_run?'On · dry run (fills, doesn’t submit)':'On · submits';
  const lr=prof.last_run;$('#lastrun').textContent=lr?`Last run ${new Date(lr.at).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}: ${lr.jobs_seen||0} jobs read, ${lr.screened_in||0} fit, ${lr.ready||0} ready, ${lr.needs_you||0} need you.`:'Hasn’t run yet.';
  if(!prof.resume){$('#tabs').querySelectorAll('button')[1].click();toast('Start by uploading your résumé.')}
  loadApps();
}
async function loadApps(){
  const box=$('#apps');let all=[];try{all=(await api('GET','/api/jobs/apps')).apps}catch(e){box.textContent=e.message;return}
  const counts={};all.forEach(a=>counts[a.status]=(counts[a.status]||0)+1);
  const f=$('#filters');f.textContent='';['ready','needs_you','filled','submitted','found','skipped','failed'].forEach(k=>{const b=el('button','chip'+(k===filter?' on':''),STATUS[k]);b.type='button';if(counts[k])b.append(el('b',null,String(counts[k])));b.onclick=()=>{filter=k;loadApps()};f.append(b)});
  box.textContent='';const rows=all.filter(a=>a.status===filter);if(['ready','found','needs_you'].includes(filter))rows.sort((x,y)=>(y.priority||0)-(x.priority||0));
  if(!rows.length){box.append(el('p','fine',{ready:'Nothing ready yet. Run now, or wait for tonight.',needs_you:'Nothing needs you.',filled:'No dry-run fills yet. The laptop runner fills these.',submitted:'Nothing submitted yet.'}[filter]||'Nothing here.'));return}
  rows.forEach(a=>{const b=el('button','app');b.type='button';b.append(el('b',null,`${a.title} · ${a.company}`),el('span','pill s-'+a.status,STATUS[a.status]||a.status));
    const sm=el('small');sm.append(a.location||'',' · ');const sp=el('span','sp-'+(a.sponsor||'unknown'),SPONSOR[a.sponsor]||'');sm.append(sp);if(a.why&&a.why.length&&['needs_you','skipped','failed'].includes(a.status))sm.append(' · '+a.why[0]);
    b.append(sm);b.onclick=()=>openApp(a.id);box.append(b)});
}
async function openApp(id){
  const d=$('#detail');d.hidden=false;d.textContent='';d.append(el('p','fine','Loading…'));d.scrollIntoView({behavior:'smooth',block:'start'});
  let a;try{a=await api('GET','/api/jobs/apps/'+id)}catch(e){d.textContent=e.message;return}
  d.textContent='';const j=a.job||{};
  const top=el('div','row');top.style.justifyContent='space-between';top.append(el('h2',null,'Application'),el('span','pill s-'+a.status,STATUS[a.status]||a.status));d.append(top);
  d.append(el('h3',null,`${j.title} · ${j.company}`),el('p','fine',`${j.location||''} · ${(j.ats||'').toUpperCase()} · `+((a.screen||{}).sponsor?`${SPONSOR[a.screen.sponsor.level]}: ${a.screen.sponsor.why}`:'')));
  const links=el('div','row');const post=el('a','btn small','Open the posting');post.href=j.url;post.target='_blank';post.rel='noopener';links.append(post);
  if(a.resume){['pdf','docx'].forEach(k=>{const x=el('button','btn small',`Résumé (.${k})`);x.type='button';x.onclick=()=>dl(`/api/jobs/apps/${a.id}/file/${k}`,`resume.${k}`);links.append(x)})}d.append(links);
  if((a.why||[]).length)a.why.forEach(w=>d.append(el('p','warnline',w)));
  if(a.brief){const b=el('div','brief');b.append(el('h2',null,'What they’re hiring to solve'),el('p',null,a.brief.problem));if(a.brief.context)b.append(el('p','fine',a.brief.context));
    if(a.brief.must_haves.length){const ul=el('ul','plain');a.brief.must_haves.forEach(m=>ul.append(el('li',null,m)));b.append(el('p','fine','Must-haves:'),ul)}d.append(b)}
  if(a.check){const c=a.check;d.append(el('h2',null,'Two-step check'));
    d.append(el('p',null,`1. Truth: ${c.truth.passed?'✓ every bullet traces to your real résumé':'✕ problems left'} · 2. Fit and format: ${c.fit.passed?'✓ passed':'notes below'}`));
    (c.history||[]).forEach(h=>{if(h.truth.length||h.fit.length){const det=el('details');det.append(el('summary',null,`Attempt ${h.attempt}: ${h.truth.length+h.fit.length} issue(s) found and sent back`));[...h.truth,...h.fit].forEach(x=>det.append(el('div','issue',x)));d.append(det)}});
    [...c.truth.issues,...c.fit.issues].forEach(i=>d.append(el('div','issue'+(i.kind==='truth'?' bad':''),`${i.where}: ${i.detail}`)));
    (c.replaced||[]).forEach(r=>d.append(el('div','issue',r)));
    if((c.fit.coverage||[]).length){const ul=el('ul','plain');c.fit.coverage.forEach(x=>ul.append(el('li',null,`${x.status==='covered'?'✓':x.status==='not_in_his_background'?'—':'!'} ${x.must_have}${x.status==='not_in_his_background'?' (an honest gap)':''}`)));d.append(el('p','fine','Must-haves covered:'),ul)}}
  if(a.resume&&a.resume.text){const det=el('details');det.append(el('summary',null,'The tailored résumé'),Object.assign(el('pre','cv'),{textContent:a.resume.text}));d.append(det)}
  if((a.answers||[]).length){d.append(el('h2',null,'Answers'));a.answers.forEach(x=>{const r=el('div','ans'+(x.needs_you?' need':''));r.append(el('b',null,x.label),el('span',null,x.value==null?'— waits for you':String(x.value)));
    r.append(el('small',null,x.why+(x.quote?` · “${x.quote}”`:'')));d.append(r)})}
  if((a.screenshots||[]).length){const s=el('div','shots');s.append(el('h2',null,'What the runner saw'));a.screenshots.forEach(b64=>{const i=el('img');i.alt='Screenshot of the filled application';i.src='data:image/jpeg;base64,'+b64;s.append(i)});d.append(s)}
  if(a.confirmation)d.append(el('p','fine','Confirmation: '+a.confirmation.slice(0,400)));
  const acts=el('div','row');const act=(label,action)=>{const b=el('button','btn small',label);b.type='button';b.onclick=async()=>{try{await api('POST',`/api/jobs/apps/${a.id}/action`,{action});toast('Done.');loadApps();openApp(a.id)}catch(e){toast(e.message)}};acts.append(b)};
  if(a.status!=='skipped')act('Skip it','skip');if(['needs_you','filled','failed','skipped'].includes(a.status))act('Queue for the runner','requeue');if(a.status!=='submitted')act('I applied myself','mark_submitted');
  d.append(acts);
}
async function dl(url,name){try{const res=await fetch(url,{headers:headers()});if(!res.ok)throw new Error('That file isn’t ready.');const b=await res.blob();const u=URL.createObjectURL(b),x=el('a');x.href=u;x.download=(res.headers.get('content-disposition')||'').split('filename="')[1]?.replace('"','')||name;document.body.append(x);x.click();x.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)}catch(e){toast(e.message)}}
$('#runnow').onclick=async()=>{const b=$('#runnow');b.disabled=true;$('#live').hidden=false;$('#livetext').textContent='Starting…';
  try{const res=await fetch('/api/jobs/run',{method:'POST',headers:headers()});const type=res.headers.get('content-type')||'';if(!res.ok||!type.includes('text/event-stream')){const d=await res.json().catch(()=>({}));throw new Error(d.message||'Couldn’t start.')}
    await readSSE(res,(k,d)=>{if(k==='status')$('#livetext').textContent=d.label+'…';else if(k==='final'){$('#livetext').textContent=d.ok?`Done: ${d.jobs_seen} jobs read, ${d.screened_in} fit, ${d.ready} ready, ${d.needs_you} need you.`:d.message;filter='ready';loadApps()}else if(k==='error')throw new Error(d.message)})}
  catch(e){$('#livetext').textContent=e.message}finally{b.disabled=false;setTimeout(()=>{$('#live').hidden=true},8000)}};

// ---------- settings ----------
function readFile(f){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(r.error);r.readAsDataURL(f)})}
function drawSettings(){drawResume();drawRules();drawSheet();drawRunner()}
function drawResume(){
  const c=$('#c-resume');c.textContent='';c.append(el('h2',null,'Your résumé'));const r=prof.resume;
  if(r){const ul=el('ul','plain');r.jobs.forEach(j=>ul.append(el('li',null,`${j.title}, ${j.company} (${j.start} – ${j.end}): ${j.bullets} bullets`)));c.append(ul,el('p','fine',`${r.skills} skills · ${r.bank} extra true bullets in the bank${r.dropped?` · ${r.dropped} line(s) left out because they weren’t copied exactly`:''}`))}
  else c.append(el('p','fine','Upload your locked-template résumé (.docx works best). Every tailored version is built only from what’s in here.'));
  const up=(add)=>{const i=el('input');i.type='file';i.accept='.docx,.pdf,.txt';i.onchange=async()=>{const f=i.files[0];if(!f)return;toast('Reading your résumé…');try{const d=await api('POST','/api/jobs/resume',{name:f.name,data:await readFile(f),add});prof=d;toast(d.message);drawResume()}catch(e){toast(e.message)}};i.click()};
  const row=el('div','row');const b1=el('button','btn red',r?'Replace résumé':'Upload résumé');b1.type='button';b1.onclick=()=>up(false);row.append(b1);
  if(r){const b2=el('button','btn','Add another résumé to the bullet bank');b2.type='button';b2.onclick=()=>up(true);row.append(b2)}
  c.append(row,el('p','fine','Adding your other tailored résumés gives Job Pilot more true bullets to choose from. Only bullets under the same companies are used.'));
}
function drawRules(){
  const c=$('#c-rules');c.textContent='';const R=prof.rules;c.append(el('h2',null,'What to apply to'));
  const on=el('div','tog');const t=el('span');t.append(el('b',null,'Job Pilot is on'),el('small',null,'Runs every night at the hour below'));on.append(t,toggle(prof.enabled,async v=>{try{prof=await api('PUT','/api/jobs/profile',{enabled:v});load()}catch(e){toast(e.message);drawRules()}},'Job Pilot on'));c.append(on);
  const dry=el('div','tog');const t2=el('span');t2.append(el('b',null,'Dry run'),el('small',null,'Fill every page but don’t click Submit; screenshots come back for you to check. Keep this on for the first week.'));
  dry.append(t2,toggle(R.dry_run,v=>save({dry_run:v}),'Dry run'));c.append(dry);
  const g=el('div','grid2');
  const fld=(label,key,kind='text',hint)=>{const l=el('label','f',label);let i;if(kind==='list'){i=el('textarea','field');i.value=(R[key]||[]).join('\n')}else{i=el('input','field');i.type=kind;i.value=R[key]??''}
    i.onchange=()=>save({[key]:kind==='list'?i.value.split('\n').map(s=>s.trim()).filter(Boolean):kind==='number'?Number(i.value):i.value});l.append(i);if(hint)l.append(el('small',null,hint));g.append(l)};
  fld('Preferred cities (first in line)','preferred_locations','list','One per line. Others in the US still count if you’re open to relocating.');
  fld('Titles you’ll use on the résumé','titles','list','The résumé title is only ever one of these.');
  fld('Companies to skip','exclude_companies','list','Your employer, and companies where you’re already interviewing.');
  fld('Most years a role may require','max_years_required','number');fld('Fewest years (to skip junior roles)','min_years_required','number');
  fld('Applications per night (cap)','nightly_cap','number','More than about 10 hurts response rates.');fld('Run hour (24h, server time zone)','run_hour','number');
  c.append(g);
  const sp=el('div','tog');const t3=el('span');t3.append(el('b',null,'Only employers likely to sponsor'),el('small',null,'Skips postings that say they won’t sponsor, and employers with little H-1B history.'));
  sp.append(t3,toggle(R.sponsor_filter==='likely',v=>save({sponsor_filter:v?'likely':'any',needs_sponsorship:true}),'Only likely sponsors'));c.append(sp);
  c.append(el('p','fine',prof.sponsor_index?'H-1B history is loaded.':'H-1B history isn’t loaded yet: run runner/build_sponsor_index.py on your laptop once (instructions under Laptop runner). Until then, only what each posting says is used.'));
}
async function save(patch){try{prof=await api('PUT','/api/jobs/profile',{rules:{...prof.rules,...patch}});$('#mode').textContent=!prof.enabled?'Off':prof.rules.dry_run?'On · dry run (fills, doesn’t submit)':'On · submits';toast('Saved.')}catch(e){toast(e.message)}}
const SHEET=[['first_name','First name'],['last_name','Last name'],['email','Email'],['phone','Phone'],['address','Street address'],['city','City'],['state','State'],['zip','ZIP'],['country','Country'],['linkedin','LinkedIn URL'],['website','Website or portfolio'],
  ['authorized','Authorized to work in the US? (Yes/No)'],['sponsorship','Will you need visa sponsorship now or in future? (Yes/No)'],['relocate','Willing to relocate? (Yes/No)'],['salary','Salary expectation'],['start_date','Earliest start date'],['notice','Notice period'],
  ['adult','18 or older? (Yes/No)'],['previous_employee','Worked for the company before? (usually No)'],['noncompete','Bound by a non-compete? (Yes/No)'],['how_heard','How did you hear about us?'],['remote_ok','OK with on-site or hybrid? (Yes/No)'],
  ['gender','Gender (or “Decline to self-identify”)'],['race','Race/ethnicity (or “Decline to self-identify”)'],['veteran','Veteran status (or “I don’t wish to answer”)'],['disability','Disability (or “I don’t wish to answer”)'],['pronouns','Pronouns (optional)'],
  ['certify','Accept “I certify this application is accurate” checkboxes for you? (Yes/No)']];
async function drawSheet(){
  const c=$('#c-sheet');c.textContent='';c.append(el('h2',null,'Your answer sheet'),el('p','fine','Answers you give once, used for every application. Stored encrypted. Work-authorization and sponsorship questions are only ever answered from here, with their wording checked, so a “without sponsorship” question gets the right answer.'));
  if(!prof.encryption){c.append(el('p','warnline','The server has no encryption key yet (INBOX_KEY), so the sheet can’t be saved.'));return}
  let sheet={};try{sheet=(await api('GET','/api/jobs/sheet')).sheet}catch(e){}
  const g=el('div','grid2'),inputs={};SHEET.forEach(([k,label])=>{const l=el('label','f',label);const i=el('input','field');i.value=sheet[k]||'';inputs[k]=i;l.append(i);g.append(l)});c.append(g);
  c.append(el('h3',null,'Other questions you want answered a certain way'));const cust=el('div','list');const addRow=(q='',a='')=>{const r=el('div','grid2');const qi=el('input','field');qi.placeholder='Question (or part of it)';qi.value=q;const ai=el('input','field');ai.placeholder='Your answer';ai.value=a;r.append(qi,ai);cust.append(r)};
  (sheet.custom||[]).forEach(x=>addRow(x.question,x.answer));addRow();c.append(cust);const more=el('button','btn small','Add another');more.type='button';more.onclick=()=>addRow();
  const sv=el('button','btn red','Save answer sheet');sv.type='button';sv.onclick=async()=>{const s={};Object.entries(inputs).forEach(([k,i])=>{if(i.value.trim())s[k]=i.value.trim()});
    s.custom=[...cust.children].map(r=>({question:r.children[0].value.trim(),answer:r.children[1].value.trim()})).filter(x=>x.question&&x.answer);
    try{const d=await api('PUT','/api/jobs/sheet',{sheet:s});toast(`Saved ${d.saved.length} answers${d.custom?` and ${d.custom} custom`:''}.`)}catch(e){toast(e.message)}};
  const r=el('div','row');r.append(more,sv);c.append(r);
}
function drawRunner(){
  const c=$('#c-runner');c.textContent='';c.append(el('h2',null,'Laptop runner'),el('p','fine','The server prepares applications. A small program on your laptop fills in the forms at night (cloud servers get blocked by job sites), including creating Workday and iCIMS accounts. It never solves CAPTCHAs: those wait for you.'));
  const steps=el('ol','plain');['Install Python 3.11+, then: pip install playwright keyring && python -m playwright install chromium','Download runner/job_pilot.py and runner/build_sponsor_index.py from your GitHub repo.','Make a runner token below and run: python job_pilot.py setup (it asks for the token and, for Workday/iCIMS email verification, a Gmail app password).','Once: python build_sponsor_index.py (downloads the Department of Labor’s H-1B data and uploads the employer summary).','Schedule it nightly: python job_pilot.py schedule (sets up a nightly task). Keep the laptop plugged in and awake.'].forEach(s=>steps.append(el('li',null,s)));c.append(steps);
  const out=el('div');const b=el('button','btn red',prof.runner?'Make a new runner token':'Make a runner token');b.type='button';
  b.onclick=async()=>{if(prof.runner&&!b.dataset.sure){b.dataset.sure='1';b.textContent='Tap again: the old token stops working';return}try{const d=await api('POST','/api/jobs/runner-token');out.textContent='';out.append(el('code','tok',d.token),el('p','fine',d.note));prof.runner=true;b.textContent='Make a new runner token';delete b.dataset.sure}catch(e){toast(e.message)}};
  c.append(b,out,el('p','fine',`${prof.companies} companies in the search list so far.`));
}
load();
})();
</script>
